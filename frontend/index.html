<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Chat</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: -apple-system, sans-serif; background: #111; color: #fff; height: 100vh; overflow: hidden; }
        .chat-container { width: 100%; max-width: 500px; height: 100vh; margin: 0 auto; display: flex; flex-direction: column; background: #1a1a1a; }
        
        /* Шапка */
        header { background: #1a1a1a; padding: 15px; text-align: center; border-bottom: 1px solid #333; font-weight: bold; font-size: 18px; color: #fff; }

        .messages { flex: 1; overflow-y: auto; padding: 15px; display: flex; flex-direction: column; gap: 10px; }
        .message { max-width: 85%; padding: 10px 14px; border-radius: 18px; font-size: 15px; }
        .message.bot { background: #2c2c2e; align-self: flex-start; border-bottom-left-radius: 4px; }
        .message.user { background: #444; align-self: flex-end; border-bottom-right-radius: 4px; }
        
        .input-area { padding: 10px; background: #1a1a1a; border-top: 1px solid #333; display: flex; align-items: flex-end; gap: 8px; }
        textarea { flex: 1; background: #2c2c2e; border: 1px solid #444; border-radius: 18px; color: #fff; padding: 10px 15px; outline: none; resize: none; min-height: 40px; max-height: 120px; line-height: 1.4; }
        button { background: none; border: none; color: #0a84ff; font-size: 22px; cursor: pointer; padding: 5px; }
    </style>
</head>
<body>
    <div class="chat-container">
        <header>Друг и помощник</header>
        <div class="messages" id="messages"></div>
        <div class="input-area">
            <input type="file" id="file-input" accept="image/*" style="display: none;">
            <button id="attach-btn" style="display: none;">📎</button> <textarea id="input" placeholder="Сообщение..." rows="1"></textarea>
            <button id="send-btn">➤</button>
        </div>
    </div>

    <script>
        const messagesContainer = document.getElementById('messages');
        const inputArea = document.getElementById('input');
        const sendBtn = document.getElementById('send-btn');

        // Автоматическое расширение поля ввода до 1/3 экрана
        inputArea.addEventListener('input', function() {
            this.style.height = 'auto';
            this.style.height = (this.scrollHeight) + 'px';
        });

        // Функция, которая делает текст ИИ красивым (обрабатывает звёздочки и абзацы)
        function formatAiText(text) {
            let rawText = text || "";
            
            // Превращаем двойные звёздочки **текст** в жирный шрифт
            rawText = rawText.replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>');
            
            // Превращаем одиночные звёздочки *текст* в красивый курсив
            rawText = rawText.replace(/\*(.*?)\*/g, '<em>$1</em>');
            
            // Вычищаем сиротливые одиночные звёздочки
            rawText = rawText.replace(/\*/g, '');
            
            // Разбиваем текст на абзацы по переносам строк
            const paragraphs = rawText.split('\n');
            
            let formattedHtml = paragraphs.map(p => {
                if (p.trim() === '---' || p.trim() === '***') {
                    return '<hr style="border: 0; border-top: 1px solid #333; margin: 12px 0;">';
                }
                if (p.trim() === "") {
                    return '<div style="height: 10px;"></div>';
                }
                return `<p style="margin-bottom: 8px; line-height: 1.5;">${p}</p>`;
            }).join('');
            
            return formattedHtml;
        }

        // Функция добавления сообщений в ленту чата
        function appendMessage(text, isUser) {
            const className = isUser ? 'message user' : 'message bot';
            const finalHtml = isUser ? text.replace(/\n/g, '<br>') : formatAiText(text);
            
            messagesContainer.insertAdjacentHTML('beforeend', `<div class="${className}">${finalHtml}</div>`);
            messagesContainer.scrollTop = messagesContainer.scrollHeight;
        }

        // Загрузка истории чата из базы данных
        async function loadChatHistory() {
            try {
                const response = await fetch("https://new-1-5155.onrender.com/api/history");
                const history = await response.json();
                messagesContainer.innerHTML = ""; 
                history.forEach(msg => {
                    const isUser = msg.role === 'user';
                    appendMessage(msg.content || msg.text, isUser);
                });
            } catch (e) {
                console.error("Ошибка загрузки истории:", e);
            }
        }

        // Нажатие на кнопку отправки
        sendBtn.addEventListener('click', async () => {
            const text = inputArea.value.trim();
            if (!text) return;
            
            appendMessage(text, true); 
            inputArea.value = '';
            inputArea.style.height = '40px'; 

            try {
                const response = await fetch("https://new-1-5155.onrender.com/api/chat", {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ text: text })
                });
                const data = await response.json();
                appendMessage(data.text, false); 
            } catch (e) {
                appendMessage("Ошибка соединения. Сервер на Render спит.", false);
            }
        });

        // Запуск истории при открытии
        document.addEventListener('DOMContentLoaded', loadChatHistory);
    </script>
</body>
</html>
