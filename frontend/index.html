<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>AI Chat</title>
  <link rel="stylesheet" href="styles.css" />
</head>

<body>
  <div class="app">

    <!-- TOP BAR -->
    <header class="topbar">
      <div class="title">💬 AI Chat</div>

      <div class="actions">
        <button id="privateBtn" class="btn">🔒 Приватный</button>
        <button id="clearBtn" class="btn">🗑 Очистить</button>
      </div>
    </header>

    <!-- CHAT AREA -->
    <main id="messages" class="messages"></main>

    <!-- INPUT -->
    <form id="form" class="input-area">
      <input
        id="input"
        autocomplete="off"
        placeholder="Напишите сообщение..."
      />
      <button type="submit">➤</button>
    </form>

  </div>

  <script src="main.js"></script>
</body>
</html>
