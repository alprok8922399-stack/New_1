<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Chat</title>
  <style>
    body { background: #121212; color: white; padding: 10px; height: 90vh; display: flex; flex-direction: column; }
    #messages { flex: 1; overflow-y: auto; border: 1px solid #333; padding: 10px; margin-bottom: 10px; }
    .message { margin: 10px 0; padding: 10px; border-radius: 8px; }
    .user { background: #1e88e5; text-align: right; }
    .bot { background: #333; text-align: left; }
    .input-area { display: flex; gap: 5px; }
    input { flex: 1; padding: 10px; }
  </style>
</head>
<body>
  <div id="messages"></div>
  <div class="input-area">
    <input id="input" type="text" placeholder="Сообщение...">
    <button onclick="send()">Отправить</button>
  </div>

  <script>
    async function send() {
      const input = document.getElementById("input");
      const text = input.value.trim();
      if (!text) return;

      try {
        const response = await fetch("https://new-1-5155.onrender.com/api/chat", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ text: text, secret: "test-secret" })
        });
        
        const data = await response.json();
        document.getElementById("messages").innerHTML += `<div class="message bot">${data.text}</div>`;
      } catch (err) {
        // ЭТА СТРОКА ВЫВЕДЕТ ТЕХНИЧЕСКУЮ ОШИБКУ ПРЯМО НА ЭКРАН
        alert("Ошибка: " + err.message + "\n\nСкопируй это и пришли мне!");
      }
    }
  </script>
</body>
</html>
