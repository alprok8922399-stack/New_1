<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ИИ Чат с Памятью</title>
    <link rel="stylesheet" href="styles.css?v=2">
</head>
<body>

    <div class="chat-container">
        <div class="messages" id="messages"></div>

        <div id="image-preview-container" class="preview-hidden">
            <img id="image-preview" src="" alt="Превью">
            <button id="cancel-image-btn">X</button>
        </div>

        <div class="input-container">
            <button id="attach-btn">📎</button>
            <input type="file" id="file-input" accept="image/*" style="display: none;">
            
            <textarea id="input" placeholder="Напишите сообщение..." rows="1"></textarea>
            
            <button id="send-btn">📌</button>
        </div>
    </div>

    <script src="main.js"></script>
</body>
</html>
