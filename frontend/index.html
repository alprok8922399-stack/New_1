<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>AI Chat</title>

  <link rel="stylesheet" href="./styles.css" />

  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>

  <style>
    /* ===== LOGIN SCREEN ===== */
    #loginScreen {
      position: fixed;
      inset: 0;
      background: #0f0f0f;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      z-index: 9999;
      color: white;
    }

    #loginBox {
      display: flex;
      flex-direction: column;
      gap: 10px;
      width: 260px;
    }

    #loginInput {
      padding: 12px;
      border-radius: 8px;
      border: none;
      font-size: 16px;
      outline: none;
    }

    #loginBtn {
      padding: 10px;
      border: none;
      border-radius: 8px;
      background: #333;
      color: white;
      cursor: pointer;
    }

    #hint {
      font-size: 12px;
      opacity: 0.6;
      text-align: center;
    }
  </style>
</head>

<body>

<!-- ===== LOGIN ===== -->
<div id="loginScreen">
  <h2>💬 AI Chat</h2>

  <div id="loginBox">
    <input id="loginInput" type="text" placeholder="Как твоё имя?" />
    <button id="loginBtn" onclick="login()">Войти</button>
    <div id="hint">Если вводишь “Ошибка 123” → личный чат</div>
  </div>
</div>

<!-- ===== CHAT ===== -->
<div class="app" id="app" style="display:none;">

  <header class="topbar">
    <div class="title">💬 AI Chat</div>

    <div class="actions">
      <button class="btn">🔒 Приватный</button>
    </div>
  </header>

  <main id="messages" class="messages"></main>

  <form id="form" class="input-area">
    <input id="input" type="text" placeholder="Напишите сообщение..." />
    <button type="submit">➤</button>
  </form>

</div>

<script src="./main.js"></script>

<script>
  const ADMIN_KEY = "Ошибка 123";

  function login() {
    const val = document.getElementById("loginInput").value.trim();

    if (!val) return;

    let sessionKey;
    let mode;

    if (val === ADMIN_KEY) {
      sessionKey = "admin";
      mode = "admin";
    } else {
      sessionKey = "user_" + val;
      mode = "guest";
    }

    localStorage.setItem("session_key", sessionKey);
    localStorage.setItem("mode", mode);

    document.getElementById("loginScreen").style.display = "none";
    document.getElementById("app").style.display = "flex";
  }

  function autoLogin() {
    const saved = localStorage.getItem("session_key");

    if (saved) {
      document.getElementById("loginScreen").style.display = "none";
      document.getElementById("app").style.display = "flex";
    }
  }

  autoLogin();
</script>

</body>
</html>
