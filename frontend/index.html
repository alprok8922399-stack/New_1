<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Chat</title>
  <style>
    body { background-color: #121212; color: white; font-family: sans-serif; margin: 0; padding: 10px; height: 100vh; display: flex; flex-direction: column; box-sizing: border-box; }
    #messages { flex: 1; overflow-y: auto; border: 1px solid #333; padding: 10px; margin-bottom: 10px; border-radius: 8px; }
    .message { margin: 10px 0; padding: 10px; border-radius: 8px; max-width: 85%; word-wrap: break-word; }
    .user { background: #1e88e5; text-align: right; margin-left: auto; }
    .bot { background: #333; text-align: left; margin-right: auto; }
    .input-area { display: flex; gap: 5px; }
    input { flex: 1; padding: 12px; background: #222; color: white; border: 1px solid #444; border-radius: 5px; font-size: 16px; }
    button { padding: 12px 20px; background: #4caf50; color: white; border: none; border-radius: 5px; font-size: 16px; }
  </style>
</head>
<body>

  <div id="messages"></div>
  
  <div class="input-area">
    <input id="input" type="text" placeholder="Сообщение...">
    <button onclick="send()">Отправить</button>
  </div>

  <script>
    async function send() {
      const input = document.getElementById("input");
      const msgs = document.getElementById("messages");
      const text = input.value.trim();
      if (!text) return;

      msgs.innerHTML += `<div class="message user">${text}</div>`;
      input.value = "";
      msgs.scrollTop = msgs.scrollHeight;

      try {
        // САМЫЙ ПРОСТОЙ ЗАПРОС БЕЗ ЗАГОЛОВКОВ (Браузер не будет его блокировать)
        const response = await fetch("https://new-1-5155.onrender.com/api/chat", {
          method: "POST",
          body: JSON.stringify({ text: text, secret: "test-secret" })
        });
        
        const data = await response.json();
        msgs.innerHTML += `<div class="message bot">${data.text}</div>`;
      } catch (err) {
        msgs.innerHTML += `<div class="message bot" style="color:#ff5252">Ошибка соединения. Попробуй еще раз.</div>`;
      }
      
      msgs.scrollTop = msgs.scrollHeight;
    }
  </script>
</body>
</html>
