<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Chat</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; background: #000000; color: #fff; height: 100vh; overflow: hidden; }
        
        .auth-container { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: #000000; display: flex; flex-direction: column; justify-content: center; align-items: center; z-index: 9999; padding: 20px; }
        .auth-box { width: 100%; max-width: 320px; text-align: center; display: flex; flex-direction: column; gap: 15px; }
        .auth-box input { background: #1c1c1e; border: 1px solid #333; border-radius: 12px; color: #fff; padding: 14px; font-size: 16px; text-align: center; outline: none; }
        .auth-box button { background: #0a84ff; border: none; border-radius: 12px; color: #fff; padding: 14px; font-size: 16px; font-weight: bold; cursor: pointer; }
        
        .chat-container { width: 100vw; max-width: 100%; height: 100vh; display: flex; flex-direction: column; background: #000000; display: none; }
        header { padding: 12px 15px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #222; font-weight: bold; font-size: 18px; }
        .clear-btn { background: none; border: 1px solid #3a3a3c; color: #0a84ff; padding: 4px 8px; border-radius: 10px; font-size: 13px; cursor: pointer; }
        .messages { flex: 1; overflow-y: auto; padding: 15px; display: flex; flex-direction: column; gap: 16px; }
        .message-wrapper { display: flex; flex-direction: column; width: 100%; }
        
        .message { max-width: 90%; padding: 12px 16px; border-radius: 18px; font-size: 15px; word-wrap: break-word; line-height: 1.45; }
        .message.bot { background: #1c1c1e; align-self: flex-start; border-bottom-left-radius: 4px; color: #f3f4f6; }
        .message.user { background: #2c2c2e; align-self: flex-end; border-bottom-right-radius: 4px; color: #fff; }
        
        .message p { margin-bottom: 8px; }
        .message p:last-child { margin-bottom: 0; }
        .message strong { color: #fff; font-weight: bold; }
        .message em { font-style: italic; color: #d1d5db; }

        /* Стили для красивых блоков кода */
        .code-container {
            position: relative;
            margin: 10px 0;
            background: #000000;
            border: 1px solid #333;
            border-radius: 10px;
            padding: 12px;
        }
        .code-block {
            overflow-x: auto;
            white-space: pre;
            font-family: 'Courier New', monospace; 
            font-size: 14px; 
            color: #50fa7b;
        }
        .copy-code-btn {
            position: absolute;
            top: 6px;
            right: 6px;
            background: #2c2c2e;
            color: #0a84ff;
            border: 1px solid #333;
            padding: 3px 8px;
            border-radius: 6px;
            font-size: 11px;
            cursor: pointer;
            font-weight: 500;
            z-index: 10;
        }
        .copy-code-btn:active { background: #3a3a3c; }
        
        .input-area { padding: 10px; background: #000000; border-top: 1px solid #222; display: flex; flex-direction: column; gap: 5px; }
        .input-row { display: flex; align-items: flex-end; gap: 8px; }
        textarea { flex: 1; background: #1c1c1e; border: 1px solid #333; border-radius: 18px; color: #fff; padding: 10px 15px; outline: none; resize: none; min-height: 40px; font-size: 16px; }
        #send-btn { background: none; border: none; color: #0a84ff; font-size: 22px; cursor: pointer; padding: 5px; }
    </style>
</head>
<body>
    <div class="auth-container" id="auth-screen">
        <div class="auth-box">
            <h2>Введите ваше имя</h2>
            <input type="text" id="username-input" placeholder="Как вас зовут?" autofocus>
            <button id="login-btn">Войти</button>
        </div>
    </div>
    <div class="chat-container" id="chat-screen">
        <header>
            <div id="chat-header-title">Чат</div>
            <button class="clear-btn" id="clear-btn">Очистить</button>
        </header>
        <div class="messages" id="messages"></div>
        <div class="input-area">
            <div class="input-row">
                <textarea id="input" placeholder="Сообщение..." rows="1"></textarea>
                <button id="send-btn">➤</button>
            </div>
        </div>
    </div>
    <script>
        const SECRET_CODE = 'alprok8922399';
        let chatMode = 'public'; 
        let userDisplayName = 'Гость';

        const authScreen = document.getElementById('auth-screen');
        const chatScreen = document.getElementById('chat-screen');
        const messagesContainer = document.getElementById('messages');
        const inputArea = document.getElementById('input');
        const sendBtn = document.getElementById('send-btn');
        const clearBtn = document.getElementById('clear-btn');
        const headerTitle = document.getElementById('chat-header-title');

        clearBtn.addEventListener('click', () => {
            messagesContainer.innerHTML = "";
        });

        document.getElementById('login-btn').addEventListener('click', () => {
            const inputVal = document.getElementById('username-input').value.trim();
            if (inputVal === SECRET_CODE) {
                chatMode = 'private';
                userDisplayName = 'Алексей';
                headerTitle.textContent = 'Друг и помощник';
                clearBtn.style.display = 'block';
            } else {
                chatMode = 'public';
                userDisplayName = inputVal || 'Гость';
                headerTitle.textContent = 'Публичный чат';
                clearBtn.style.display = 'none';
            }
            authScreen.style.display = 'none';
            chatScreen.style.display = 'flex';
            loadChatHistory();
        });

        async function loadChatHistory() {
            if (chatMode === 'public') return;
            const response = await fetch("[https://new-1-5155.onrender.com/api/history?mode=private](https://new-1-5155.onrender.com/api/history?mode=private)");
            const history = await response.json();
            messagesContainer.innerHTML = ""; 
            history.forEach(msg => appendMessage(msg.content, msg.role === 'user'));
        }

        // Обновленная функция форматирования текста без ломающихся кавычек
        function formatAiText(text) {
            let rawText = text || "";
            
            // Заменяем блоки кода на временные метки, чтобы они не ломали абзацы
            const codeBlocks = [];
            rawText = rawText.replace(/```([\s\S]*?)```/g, (match, p1) => {
                const placeholder = `___CODE_BLOCK_${codeBlocks.length}___`;
                codeBlocks.push(p1.trim());
                return placeholder;
            });
            
            // Форматируем жирный и курсив
            rawText = rawText.replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>');
            rawText = rawText.replace(/\*(.*?)\*/g, '<em>$1</em>');
            
            // Разбиваем текст на абзацы
            let formattedHtml = rawText.split('\n').map(p => {
                if (p.trim() === "") return '<div style="height: 6px;"></div>';
                if (p.startsWith('___CODE_BLOCK_')) return p; // Не оборачиваем метку кода в <p>
                return `<p>${p}</p>`;
            }).join('');

            // Возвращаем реальный код вместо временных меток через безопасный DOM-элемент
            codeBlocks.forEach((codeText, index) => {
                // Создаем безопасную разметку контейнера кода
                const containerHtml = `<div class="code-container"><button class="copy-code-btn">Копировать</button><div class="code-block"></div></div>`;
                formattedHtml = formattedHtml.replace(`___CODE_BLOCK_${index}___`, containerHtml);
            });
            
            return { html: formattedHtml, codes: codeBlocks };
        }

        function appendMessage(text, isUser) {
            const div = document.createElement('div');
            div.className = 'message-wrapper';
            
            if (isUser) {
                div.innerHTML = `<div class="message user">${text}</div>`;
                messagesContainer.appendChild(div);
            } else {
                // Для ИИ раскладываем текст и чистый код отдельно
                const parsed = formatAiText(text);
                div.innerHTML = `<div class="message bot">${parsed.html}</div>`;
                messagesContainer.appendChild(div);
                
                // Находим все созданные блоки кода в свежем сообщении и наполняем текстом
                const blocks = div.querySelectorAll('.code-block');
                const buttons = div.querySelectorAll('.copy-code-btn');
                
                blocks.forEach((block, index) => {
                    // textContent гарантирует, что любой код отобразится текстом и не сломает HTML
                    block.textContent = parsed.codes[index];
                    
                    // Вешаем безопасное событие клика на кнопку копирования
                    buttons[index].addEventListener('click', () => {
                        navigator.clipboard.writeText(parsed.codes[index]).then(() => {
                            buttons[index].textContent = 'Скопировано!';
                            setTimeout(() => { buttons[index].textContent = 'Копировать'; }, 2000);
                        });
                    });
                });
            }
            
            messagesContainer.scrollTop = messagesContainer.scrollHeight;
        }

        sendBtn.addEventListener('click', async () => {
            const text = inputArea.value.trim();
            if (!text) return;
            appendMessage(text, true);
            inputArea.value = '';

            const now = new Date();
            const timeString = now.toLocaleString('ru-RU');

            const response = await fetch("[https://new-1-5155.onrender.com/api/chat](https://new-1-5155.onrender.com/api/chat)", {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ 
                    text: text, 
                    mode: chatMode, 
                    user: userDisplayName,
                    client_time: timeString
                })
            });
            const data = await response.json();
            appendMessage(data.text, false); 
        });
    </script>
</body>
</html>
