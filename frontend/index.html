<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Chat</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; background: #000000; color: #fff; height: 100vh; overflow: hidden; }
        
        /* Экран ввода имени */
        .auth-container { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: #000000; display: flex; flex-direction: column; justify-content: center; align-items: center; z-index: 9999; padding: 20px; }
        .auth-box { width: 100%; max-width: 320px; text-align: center; display: flex; flex-direction: column; gap: 15px; }
        .auth-box h2 { font-size: 20px; font-weight: 600; margin-bottom: 10px; }
        .auth-box input { background: #1c1c1e; border: 1px solid #333; border-radius: 12px; color: #fff; padding: 14px; font-size: 16px; text-align: center; outline: none; }
        .auth-box button { background: #0a84ff; border: none; border-radius: 12px; color: #fff; padding: 14px; font-size: 16px; font-weight: bold; cursor: pointer; }
        
        /* Чат */
        .chat-container { width: 100vw; height: 100vh; display: flex; flex-direction: column; background: #000000; display: none; }
        header { background: #000000; padding: 12px 15px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #222; font-weight: bold; font-size: 18px; }
        .clear-btn { background: none; border: 1px solid #3a3a3c; color: #0a84ff; padding: 4px 8px; border-radius: 10px; font-size: 13px; cursor: pointer; }

        /* Сообщения - растянуты на всю ширину и прозрачные */
        .messages { flex: 1; overflow-y: auto; padding: 0; display: flex; flex-direction: column; }
        .message-wrapper { width: 100%; padding: 10px 15px; border-bottom: 1px solid #1a1a1a; }
        
        .message { 
            width: 100%; 
            padding: 0; 
            background: transparent !important; 
            font-size: 17px; 
            line-height: 1.6; 
            color: #e4e4e4; 
            word-wrap: break-word; 
        }
        .message.bot { align-self: flex-start; }
        .message.user { align-self: flex-end; color: #fff; }
        
        .message p { margin-bottom: 10px; }
        .message strong { color: #fff; font-weight: 600; }

        /* Ссылки */
        .custom-link-button { display: inline-flex; align-items: center; background: #1c1c1e; border: 1px solid #333; border-radius: 8px; padding: 8px 12px; margin: 4px 0; color: #38bdf8 !important; text-decoration: none !important; font-weight: 500; font-size: 14px; }

        /* Кнопки под сообщением */
        .message-buttons { display: flex; gap: 8px; padding: 4px 0; width: 100%; }
        .message-buttons button { background: none; border: none; color: #555; cursor: pointer; width: 24px; height: 24px; display: flex; align-items: center; justify-content: center; }
        .message-buttons button svg { width: 16px; height: 16px; stroke: currentColor; fill: none; }
        .message-buttons button:active { color: #0a84ff; }

        /* Ввод */
        .input-area { padding: 10px; background: #000000; border-top: 1px solid #222; display: flex; flex-direction: column; gap: 5px; }
        .input-row { display: flex; align-items: flex-end; gap: 8px; }
        textarea { flex: 1; background: #1c1c1e; border: 1px solid #333; border-radius: 18px; color: #fff; padding: 10px 15px; outline: none; resize: none; min-height: 40px; max-height: 120px; line-height: 1.4; font-size: 16px; font-family: sans-serif; }
        .input-row button { background: none; border: none; color: #0a84ff; font-size: 22px; cursor: pointer; }
    </style>
</head>
<body>

    <div class="auth-container" id="auth-screen">
        <div class="auth-box">
            <h2>Введите ваше имя</h2>
            <input type="text" id="username-input" placeholder="Ваше имя..." autofocus>
            <button id="login-btn">Войти</button>
        </div>
    </div>

    <div class="chat-container" id="chat-screen">
        <header>
            <div class="header-title" id="chat-header-title">Друг и помощник</div>
            <button class="clear-btn" id="clear-btn">Очистить</button>
        </header>
        <div class="messages" id="messages"></div>
        
        <div class="input-area">
            <div id="image-preview-container" style="display: none; padding: 5px; align-items: center; gap: 10px;">
                <img id="image-preview" src="" alt="Превью" style="max-height: 50px; border-radius: 6px;">
                <button id="cancel-image-btn" style="background: #ff3b30; color: #fff; border-radius: 50%; width: 20px; height: 20px; border: none;">×</button>
            </div>
            <div class="input-row">
                <input type="file" id="file-input" accept="image/*" style="display: none;">
                <button id="attach-btn">📎</button>
                <textarea id="input" placeholder="Сообщение..." rows="1"></textarea>
                <button id="send-btn">➤</button>
            </div>
        </div>
    </div>

    <script>
        const SECRET_CODE = 'alprok8922399';
        let chatMode = 'public'; 
        let userDisplayName = ''; 
        const authScreen = document.getElementById('auth-screen');
        const chatScreen = document.getElementById('chat-screen');
        const usernameInput = document.getElementById('username-input');
        const loginBtn = document.getElementById('login-btn');
        const chatHeaderTitle = document.getElementById('chat-header-title');

        function handleLogin() {
            const enteredName = usernameInput.value.trim();
            if (!enteredName) return;
            userDisplayName = enteredName;
            if (enteredName === SECRET_CODE) {
                chatMode = 'private';
                chatHeaderTitle.textContent = 'Друг и помощник';
                authScreen.style.display = 'none';
                chatScreen.style.display = 'flex';
                loadChatHistory();
            } else {
                chatMode = 'public';
                chatHeaderTitle.textContent = `Чат для: ${enteredName}`;
                authScreen.style.display = 'none';
                chatScreen.style.display = 'flex';
                messagesContainer.innerHTML = ""; 
            }
        }

        loginBtn.addEventListener('click', handleLogin);
        usernameInput.addEventListener('keypress', (e) => { if (e.key === 'Enter') handleLogin(); });

        const messagesContainer = document.getElementById('messages');
        const inputArea = document.getElementById('input');
        const sendBtn = document.getElementById('send-btn');
        const attachBtn = document.getElementById('attach-btn');
        const fileInput = document.getElementById('file-input');
        const previewContainer = document.getElementById('image-preview-container');
        const imagePreview = document.getElementById('image-preview');
        const cancelImageBtn = document.getElementById('cancel-image-btn');
        const clearBtn = document.getElementById('clear-btn');

        let selectedImageBase64 = "";
        let currentEditingMessageId = null; 

        inputArea.addEventListener('input', function() {
            this.style.height = 'auto';
            this.style.height = (this.scrollHeight) + 'px';
        });

        attachBtn.addEventListener('click', () => fileInput.click());
        fileInput.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = (event) => {
                selectedImageBase64 = event.target.result;
                imagePreview.src = selectedImageBase64;
                previewContainer.style.display = 'flex';
            };
            reader.readAsDataURL(file);
        });

        cancelImageBtn.addEventListener('click', () => {
            selectedImageBase64 = "";
            fileInput.value = "";
            previewContainer.style.display = 'none';
        });

        function formatAiText(text) {
            let rawText = text || "";
            rawText = rawText.replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>');
            const paragraphs = rawText.split('\n');
            return paragraphs.map(p => {
                if (p.trim() === "") return '<div style="height: 8px;"></div>';
                if (p.includes('class="custom-link-button"')) return p;
                return `<p>${p}</p>`;
            }).join('');
        }

        function copyToClipboard(text) {
            const cleanText = text.replace(/<[^>]*>/g, '');
            navigator.clipboard.writeText(cleanText);
        }

        function appendMessage(text, isUser, imageUrl = "", messageId = null) {
            if ((!text || text.trim() === "") && !imageUrl) return;
            const className = isUser ? 'message user' : 'message bot';
            let finalHtml = isUser ? text.replace(/\n/g, '<br>') : formatAiText(text);
            
            const wrapper = document.createElement('div');
            wrapper.className = 'message-wrapper';
            if (messageId) wrapper.setAttribute('data-id', messageId); 
            
            wrapper.innerHTML = `
                <div class="${className}">${imageUrl ? `<img src="${imageUrl}" style="max-width: 100%; border-radius: 8px; margin-bottom: 8px;">` : ''}${finalHtml}</div>
                <div class="message-buttons" style="justify-content: ${isUser ? 'flex-end' : 'flex-start'};">
                    ${isUser ? `<button class="btn-edit" title="Редактировать"><svg viewBox="0 0 24 24"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7M18.5 2.5a2.121 2.121 0 1 1 3 3L12 15l-4 1 1-4Z"/></svg></button>` : ''}
                    <button class="btn-copy" title="Копировать"><svg viewBox="0 0 24 24"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg></button>
                </div>
            `;
            
            wrapper.querySelector('.btn-copy').addEventListener('click', () => copyToClipboard(text || "Фото"));
            if (isUser) {
                wrapper.querySelector('.btn-edit').addEventListener('click', () => {
                    inputArea.value = text;
                    inputArea.focus();
                    currentEditingMessageId = messageId;
                });
            }
            messagesContainer.appendChild(wrapper);
            messagesContainer.scrollTop = messagesContainer.scrollHeight;
        }

        async function loadChatHistory() {
            try {
                const response = await fetch("https://new-1-5155.onrender.com/api/history");
                const history = await response.json();
                messagesContainer.innerHTML = ""; 
                history.forEach(msg => appendMessage(msg.content, msg.role === 'user', "", msg.id));
            } catch (e) { console.error(e); }
        }

        clearBtn.addEventListener('click', () => { messagesContainer.innerHTML = ""; });

        sendBtn.addEventListener('click', async () => {
            const text = inputArea.value.trim();
            if (!text && !selectedImageBase64) return;
            appendMessage(text || "Фото", true, selectedImageBase64); 
            const imgToSend = selectedImageBase64;
            
            if (currentEditingMessageId !== null) {
                await fetch(`https://new-1-5155.onrender.com/api/delete/${currentEditingMessageId}`, { method: 'DELETE' });
                document.querySelector(`[data-id="${currentEditingMessageId}"]`)?.remove();
                currentEditingMessageId = null; 
            }
            
            inputArea.value = '';
            inputArea.style.height = '40px'; 
            selectedImageBase64 = "";
            fileInput.value = "";
            previewContainer.style.display = 'none';

            const textWithTime = `[Системное инфо: ${new Date().toLocaleString()} ${chatMode} ${userDisplayName}]\n${text}`;
            try {
                const response = await fetch("https://new-1-5155.onrender.com/api/chat", {
                    method: 'POST', headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ text: textWithTime, image: imgToSend, mode: chatMode })
                });
                const data = await response.json();
                appendMessage(data.text, false); 
            } catch (e) { appendMessage("Ошибка соединения.", false); }
        });
    </script>
</body>
</html>
