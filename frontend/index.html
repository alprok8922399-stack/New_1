<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ИИ Чат</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: -apple-system, sans-serif; background-color: #0f0f0f; color: #fff; height: 100vh; display: flex; justify-content: center; }
        .chat-container { width: 100%; max-width: 480px; height: 100vh; display: flex; flex-direction: column; background: #1a1a1a; }
        
        .messages { flex: 1; overflow-y: auto; padding: 15px; display: flex; flex-direction: column; gap: 12px; }
        
        .message { max-width: 85%; padding: 10px 14px; border-radius: 18px; font-size: 15px; line-height: 1.4; }
        .message.bot { background-color: #2c2c2e; align-self: flex-start; border-bottom-left-radius: 4px; }
        .message.user { background-color: #3a3a3c; align-self: flex-end; border-bottom-right-radius: 4px; }
        
        .input-wrapper { padding: 10px; background: #1a1a1a; border-top: 1px solid #333; }
        .input-box { display: flex; align-items: center; background: #2c2c2e; border-radius: 24px; padding: 5px 10px; }
        
        textarea { flex: 1; background: transparent; border: none; color: #fff; padding: 10px; outline: none; resize: none; height: 24px; font-size: 15px; }
        
        button { background: transparent; border: none; color: #8e8e93; font-size: 20px; padding: 5px 10px; cursor: pointer; }
        #send-btn { color: #0a84ff; } /* Цвет стрелочки */
        
        .preview-hidden { display: none; }
        #image-preview-container { padding: 10px; display: flex; align-items: center; gap: 10px; }
        #image-preview { max-height: 50px; border-radius: 8px; }
    </style>
</head>
<body>

    <div class="chat-container">
        <div class="messages" id="messages"></div>

        <div id="image-preview-container" class="preview-hidden">
            <img id="image-preview" src="" alt="Превью">
            <button id="cancel-image-btn">×</button>
        </div>

        <div class="input-wrapper">
            <div class="input-box">
                <button id="attach-btn">📎</button>
                <input type="file" id="file-input" accept="image/*" style="display: none;">
                <textarea id="input" placeholder="Сообщение..." rows="1"></textarea>
                <button id="send-btn">➤</button>
            </div>
        </div>
    </div>

    <script src="main.js"></script>
</body>
</html>
