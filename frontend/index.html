<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Chat</title>
  <style>
    body { background-color: #121212; color: white; font-family: sans-serif; margin: 0; padding: 10px; height: 100vh; display: flex; flex-direction: column; }
    #messages { flex: 1; overflow-y: auto; border: 1px solid #333; padding: 10px; margin-bottom: 10px; border-radius: 8px; }
    .message { margin: 10px 0; padding: 10px; border-radius: 8px; }
    .user { background: #1e88e5; text-align: right; }
    .bot { background: #333; text-align: left; }
    .input-area { display: flex; gap: 5px; }
    input { flex: 1; padding: 12px; background: #222; color: white; border: 1px solid #444; border-radius: 5px; }
    button { padding: 12px; background: #4caf50; color: white; border: none; border-radius: 5px; }
  </style>
</head>
<body>

  <div id="messages"></div>
  <div class="input-area">
    <input id="input" type="text" placeholder="Сообщение...">
    <button onclick="send()">Отправить</button>
  </div>

  <script>
    async function send() {
      const input = document.getElementById("input");
      const msgs = document.getElementById("messages");
      const text = input.value.trim();
      if (!text) return;

      msgs.innerHTML += `<div class="message user">${text}</div>`;
      input.value = "";

      try {
        const response = await fetch("https://new-1-5155.onrender.com/api/chat", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ text: text, secret: "test-secret" })
        });
        
        const data = await response.json();
        msgs.innerHTML += `<div class="message bot">${data.text || 'Нет ответа'}</div>`;
        msgs.scrollTop = msgs.scrollHeight;
      } catch (err) {
        msgs.innerHTML += `<div class="message bot" style="color:red">Ошибка: ${err.message}</div>`;
      }
    }
  </script>
</body>
</html>
