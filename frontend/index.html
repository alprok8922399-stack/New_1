<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>AI Chat</title>
  <style>
    body { font-family: sans-serif; display: flex; flex-direction: column; height: 95vh; max-width: 600px; margin: 0 auto; }
    #messages { flex: 1; overflow-y: auto; border: 1px solid #ccc; padding: 10px; }
    .message { margin: 10px; padding: 10px; border-radius: 8px; }
    .user { background: #dcf8c6; text-align: right; }
    .bot { background: #f1f0f0; text-align: left; }
  </style>
</head>
<body>
  <div id="messages"></div>
  <div style="display: flex;">
    <input id="input" type="text" style="flex:1" placeholder="Сообщение...">
    <button onclick="send()">Отправить</button>
  </div>

  <script>
    async function send() {
      const input = document.getElementById("input");
      const messages = document.getElementById("messages");
      const text = input.value.trim();
      if (!text) return;

      messages.innerHTML += `<div class="message user">${text}</div>`;
      input.value = "";

      try {
        const response = await fetch("https://new-1-5155.onrender.com/api/chat", {
          method: "POST",
          mode: 'cors',
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ text: text, secret: "test-secret" })
        });
        
        const data = await response.json();
        messages.innerHTML += `<div class="message bot">${data.text || 'Нет ответа'}</div>`;
        messages.scrollTop = messages.scrollHeight;
      } catch (err) {
        messages.innerHTML += `<div class="message bot">Ошибка: ${err.message}</div>`;
      }
    }
  </script>
</body>
</html>
