<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>AI Chat 1.0 FIX</title>

  <style>
    body {
      margin: 0;
      font-family: Arial;
      background: #111;
      color: #fff;
    }

    #chat {
      height: 90vh;
      overflow-y: auto;
      padding: 10px;
    }

    .msg {
      margin: 10px 0;
      padding: 10px;
      border-radius: 10px;
      max-width: 80%;
      white-space: pre-wrap;
    }

    .user {
      background: #2b7cff;
      margin-left: auto;
    }

    .bot {
      background: #333;
    }

    #inputBox {
      display: flex;
      position: fixed;
      bottom: 0;
      width: 100%;
      background: #000;
      padding: 10px;
    }

    #text {
      flex: 1;
      padding: 10px;
      border: none;
      outline: none;
    }

    button {
      padding: 10px;
      background: #2b7cff;
      color: white;
      border: none;
    }
  </style>
</head>

<body>

<div id="chat"></div>

<div id="inputBox">
  <input id="text" placeholder="Напиши сообщение..." />
  <button onclick="send()">Отправить</button>
</div>

<script>
const chat = document.getElementById("chat");
const text = document.getElementById("text");

// ⚠️ ТВОЙ РЕАЛЬНЫЙ BACKEND
const API_URL = "https://new-1-5155.onrender.com/api/chat";

function addMsg(content, type) {
  const div = document.createElement("div");
  div.className = "msg " + type;
  div.innerText = content;
  chat.appendChild(div);
  chat.scrollTop = chat.scrollHeight;
}

async function send() {
  const message = text.value.trim();
  if (!message) return;

  addMsg(message, "user");
  text.value = "";

  try {
    const res = await fetch(API_URL, {
      method: "POST",
      headers: {
        "Content-Type": "application/json"
      },
      body: JSON.stringify({ message })
    });

    const data = await res.json();

    addMsg(data.response || "нет ответа", "bot");

  } catch (e) {
    addMsg("Ошибка соединения с сервером", "bot");
    console.log(e);
  }
}
</script>

</body>
</html>
