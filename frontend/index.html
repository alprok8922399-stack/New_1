<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>AI Chat</title>
  <link rel="stylesheet" href="styles.css"/>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github-dark.min.css">
  <style>
    .chat-container { display: flex; flex-direction: column; height: 100vh; max-width: 600px; margin: 0 auto; }
    .chat-messages { flex: 1; overflow-y: auto; padding: 10px; }
    .message { margin: 10px; padding: 10px; border-radius: 10px; }
    .user { background: #333; color: white; text-align: right; }
    .bot { background: #444; color: white; }
    .code-block { position: relative; }
    .copy-btn { position: absolute; top: 6px; right: 6px; background: #444; color: white; border: none; padding: 4px 8px; font-size: 12px; border-radius: 5px; cursor: pointer; }
    .chat-input { display: flex; padding: 10px; }
    #input { flex: 1; padding: 10px; }
  </style>
</head>
<body>
  <div class="chat-container">
    <div id="messages" class="chat-messages"></div>
    <div class="chat-input">
      <input id="input" type="text" placeholder="Напиши сообщение..." />
      <button onclick="sendMessage()">Отправить</button>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>

  <script>
    const messages = document.getElementById("messages");
    const input = document.getElementById("input");

    function addMessage(content, type){
      const div = document.createElement("div");
      div.className = "message " + type;
      div.innerHTML = marked.parse(content);
      messages.appendChild(div);
      messages.scrollTop = messages.scrollHeight;
    }

    async function sendMessage(){
      const text = input.value;
      if(!text) return;

      addMessage(text, "user");
      input.value = "";

      const res = await fetch("https://new-1-5155.onrender.com/api/chat", {
        method:"POST",
        headers:{ "Content-Type":"application/json" },
        body: JSON.stringify({ text: text })
      });

      const data = await res.json();
      addMessage(data.text || "Ошибка ответа", "bot");
    }
  </script>
</body>
</html>
