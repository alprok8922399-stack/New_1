<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AI Chat — Friend and Helper</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <header>
        <div class="header-info">
            <h1 id="chat-name">Гостевая комната</h1>
            <div class="header-status">
                <span class="status-dot"></span>
                <span>Онлайн</span>
            </div>
        </div>
        <div class="header-actions">
            <button id="btn-mail-mode" class="btn-icon" title="Отправить последнее в почту">@@@</button>
            <button id="btn-clear" class="btn-text btn-danger">Очистить</button>
            <button id="btn-room" class="btn-text btn-primary">🚪 Войти</button>
        </div>
    </header>

    <main id="chat-container"></main>

    <div id="input-container">
        <div id="model-selector-bar">
            <button class="model-badge active" data-model="auto">✨ Авто</button>
            <button class="model-badge" data-model="groq">⚡ Groq</button>
            <button class="model-badge" data-model="gemini">♊ Gemini</button>
            <button class="model-badge" data-model="openrouter">🚀 OpenRouter</button>
        </div>

        <div id="preview-container"></div>

        <div class="input-row">
            <div class="textarea-wrapper">
                <button id="btn-attach" class="btn-icon" style="font-size: 1.2rem;">🖼️</button>
                <textarea id="message-input" rows="1" placeholder="Сообщение..."></textarea>
            </div>
            <button id="btn-send" class="btn-icon btn-primary" style="width: 40px; height: 40px; border-radius: 50%; font-size: 1.1rem;">➔</button>
        </div>
    </div>

    <div id="modal-overlay" class="modal-overlay hidden">
        <div class="modal-box">
            <h3 id="modal-title">Доступ в приватную комнату:</h3>
            <input type="password" id="password-input" placeholder="Введите пароль">
            <div class="modal-buttons">
                <button id="btn-modal-cancel" class="btn-text" style="background-color: #374151;">Отмена</button>
                <button id="btn-modal-submit" class="btn-text btn-primary">ОК</button>
            </div>
        </div>
    </div>

    <script src="main.js"></script>
</body>
                    </html>
