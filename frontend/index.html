<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AI Chat</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html, body {
            width: 100%;
            height: 100%;
            background-color: #1a202c !important;
            color: #fff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            overflow: hidden;
        }

        #auth-screen {
            display: flex;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background-color: #1a202c;
            z-index: 10000;
            align-items: center;
            justify-content: center;
        }

        .auth-box {
            background: #2d3748;
            padding: 24px;
            border-radius: 12px;
            text-align: center;
            width: 90%;
            max-width: 360px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.3);
        }

        .auth-box h2 {
            margin-bottom: 16px;
            font-size: 20px;
        }

        .auth-box input {
            width: 100%;
            padding: 12px;
            border-radius: 8px;
            border: 1px solid #4a5568;
            background: #1a202c;
            color: #fff;
            margin-bottom: 16px;
            font-size: 16px;
            outline: none;
        }

        .auth-box button {
            width: 100%;
            padding: 12px;
            background: #3182ce;
            border: none;
            color: white;
            font-size: 16px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
        }

        #chat-screen {
            display: none;
            flex-direction: column;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background-color: #1a202c;
            z-index: 9999;
        }

        header {
            display: flex;
            flex-direction: row;
            justify-content: space-between;
            align-items: center;
            padding: 0 16px;
            width: 100%;
            height: 60px;
            min-height: 60px;
            background-color: #2d3748;
            border-bottom: 1px solid #4a5568;
            flex-shrink: 0;
        }

        .header-left {
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .header-title {
            font-weight: bold;
            color: #fff;
            font-size: 16px;
        }

        .model-selector-wrapper {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 12px;
            color: #a0aec0;
            margin-top: 2px;
            cursor: pointer;
            position: relative;
        }

        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background-color: #48bb78;
        }

        .header-buttons {
            display: flex;
            flex-direction: row;
            gap: 8px;
            align-items: center;
        }

        .header-buttons button {
            height: 36px;
            padding: 0 12px;
            border-radius: 6px;
            font-size: 14px;
            border: none;
            cursor: pointer;
            color: white;
            font-weight: 500;
        }

        .messages {
            flex: 1;
            overflow-y: auto;
            padding: 12px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            background: #1a202c;
        }

        .message-wrapper {
            display: flex;
            flex-direction: column;
            width: 100%;
        }
        .role-user { align-items: flex-end; }
        .role-assistant { align-items: flex-start; }

        .message {
            padding: 14px 16px;
            border-radius: 12px;
            font-size: 15px;
            line-height: 1.45;
            word-break: break-word;
        }

        .message.bot { 
            width: 100%;
            max-width: 100%;
            background: #2d3748; 
            color: white; 
            border-bottom-left-radius: 2px; 
        }

        .code-block-container {
            background: #1a202c;
            border: 1px solid #4a5568;
            border-radius: 8px;
            margin: 10px 0;
            overflow: hidden;
            width: 100%;
        }
        .code-block-header {
            background: #2d3748;
            padding: 6px 12px;
            font-size: 12px;
            color: #a0aec0;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #4a5568;
        }
        .code-block-copy-btn {
            background: #4a5568;
            color: #fff;
            border: none;
            padding: 4px 8px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 11px;
        }
        .code-block-content {
            padding: 12px;
            overflow-x: auto;
            font-family: monospace;
            font-size: 14px;
            white-space: pre;
            color: #e2e8f0;
            display: block;
        }

        .message.user { 
            max-width: 75%; 
            background: #3182ce; 
            color: white; 
            border-bottom-right-radius: 2px; 
            display: -webkit-box;
            -webkit-line-clamp: 3;
            -webkit-box-orient: vertical;  
            overflow: hidden;
        }

        .message.user.expanded {
            display: block;
            overflow: visible;
            max-width: 85%;
        }

        .toggle-btn {
            background: none;
            border: none;
            color: #a0aec0;
            font-size: 12px;
            cursor: pointer;
            padding: 2px 8px;
            margin-top: 2px;
            outline: none;
        }

        .input-area {
            padding: 12px;
            background: #2d3748;
            border-top: 1px solid #4a5568;
            flex-shrink: 0;
        }

        #image-preview-container {
            display: flex;
            align-items: center;
            gap: 10px;
            background: #1a202c;
            padding: 8px;
            border-radius: 6px;
            margin-bottom: 8px;
            border: 1px solid #4a5568;
        }

        #image-preview-container button {
            background: #e53e3e;
            color: white;
            border: none;
            border-radius: 4px;
            width: 24px;
            height: 24px;
            cursor: pointer;
            font-weight: bold;
        }

        .input-row {
            display: flex;
            gap: 8px;
            align-items: center;
        }

        .input-row textarea {
            flex: 1;
            background: #1a202c;
            border: 1px solid #4a5568;
            color: white;
            padding: 10px 12px;
            border-radius: 8px;
            resize: none;
            height: 40px;
            max-height: 120px;
            font-size: 15px;
            outline: none;
        }

        .input-row button {
            width: 40px;
            height: 40px;
            border-radius: 8px;
            border: none;
            background: #4a5568;
            color: white;
            font-size: 16px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        #send-btn { background: #3182ce; }

        .preview-hidden { display: none !important; }
    </style>
</head>
<body>

    <div id="auth-screen">
        <div class="auth-box">
            <h2>Введите ваше имя</h2>
            <input type="text" id="username-input" placeholder="Ваше имя..." autofocus>
            <button id="login-btn">Войти</button>
        </div>
    </div>

    <div id="chat-screen">
        <header>
            <div class="header-left">
                <div class="header-title" id="chat-header-title">Друг и помощник</div>
                <div class="model-selector-wrapper" id="model-selector-trigger">
                    <span class="status-dot" id="status-dot"></span>
                    <span id="active-model-name">Модель: Авто</span>
                </div>
            </div>
            <div class="header-buttons">
                <button id="mail-btn" style="background-color: #4a5568;">@@@</button>
                <button id="clear-btn" style="background-color: #e53e3e;">Очистить</button>
            </div>
        </header>
        
        <div class="messages" id="messages"></div>
        
        <div class="input-area">
            <div id="image-preview-container" class="preview-hidden">
                <img id="image-preview" src="" alt="Превью" style="max-height: 60px; border-radius: 4px;">
                <button id="cancel-image-btn">×</button>
            </div>
            <div class="input-row">
                <input type="file" id="file-input" accept="image/*" style="display: none;">
                <button id="attach-btn">📎</button>
                <textarea id="input" placeholder="Сообщение..." rows="1"></textarea>
                <button id="send-btn">➤</button>
            </div>
        </div>
    </div>

        const clearBtn = document.getElementById('clear-btn');
        
        // Переменные для скрепки
        const attachBtn = document.getElementById('attach-btn');
        const fileInput = document.getElementById('file-input');
        const previewContainer = document.getElementById('image-preview-container');

        const cancelImageBtn = document.getElementById('cancel-image-btn');
        let selectedImageBase64 = "";

        // Авто-расширение ввода текста
        inputArea.addEventListener('input', function() {
            this.style.height = 'auto';
            this.style.height = (this.scrollHeight) + 'px';
        });

        // ЛОГИКА СКРЕПКИ
        attachBtn.addEventListener('click', () => fileInput.click());
        fileInput.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = (event) => {
                selectedImageBase64 = event.target.result;
                imagePreview.src = selectedImageBase64;
                previewContainer.classList.remove('preview-hidden');
            };
            reader.readAsDataURL(file);
        });

        cancelImageBtn.addEventListener('click', () => {
            selectedImageBase64 = "";
            fileInput.value = "";
            previewContainer.classList.add('preview-hidden');
        });

        function handleLogin(e) {
            if (e) e.preventDefault();

            const enteredName = usernameInput.value.trim();
            if (!enteredName) return;

            if (enteredName === SECRET_CODE) {
                chatMode = 'private';
                userDisplayName = 'Алексей';
                chatHeaderTitle.textContent = 'Друг и помощник';
            } else {
                chatMode = 'public';
                userDisplayName = enteredName;
                chatHeaderTitle.textContent = `Чат для: ${enteredName}`;
            }

            authScreen.style.display = 'none';
            chatScreen.style.display = 'flex';
            messagesContainer.innerHTML = ""; 

            if (chatMode === 'private') {
                loadChatHistory().catch(err => console.log("История недоступна"));
            }
        }

        loginBtn.addEventListener('click', handleLogin);
        usernameInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') handleLogin(e);
        });

            }
        }
