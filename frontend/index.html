<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AI Chat</title>
    <link rel="stylesheet" href="styles.css">
    <style>
        /* Полный сброс конфликтов и жесткая фиксация экранов */
        html, body {
            margin: 0 !important;
            padding: 0 !important;
            width: 100% !important;
            height: 100% !important;
            overflow: hidden !important;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        /* Экран авторизации */
        #auth-screen {
            display: flex !important;
            width: 100% !important;
            height: 100% !important;
            align-items: center !important;
            justify-content: center !important;
            position: fixed !important;
            top: 0 !important;
            left: 0 !important;
            z-index: 9999 !important;
            background-color: #1a202c !important;
        }

        /* Главный контейнер чата */
        #chat-screen {
            display: none !important; /* Включается через JS как flex */
            flex-direction: column !important;
            width: 100% !important;
            height: 100% !important;
            position: fixed !important;
            top: 0 !important;
            left: 0 !important;
            background-color: #1a202c !important;
            z-index: 9998 !important;
        }

        /* Жесткая структура шапки (верхней кепки) */
        #chat-screen header {
            display: flex !important;
            flex-direction: row !important;
            justify-content: space-between !important;
            align-items: center !important;
            padding: 0 16px !important;
            box-sizing: border-box !important;
            width: 100% !important;
            height: 60px !important;
            min-height: 60px !important;
            background-color: #2d3748 !important;
            border-bottom: 1px solid #4a5568 !important;
            flex-shrink: 0 !important;
        }

        .header-left {
            display: flex !important;
            flex-direction: column !important;
            justify-content: center !important;
            align-items: flex-start !important;
            overflow: hidden !important;
        }

        .header-title {
            font-weight: bold !important;
            color: #fff !important;
            font-size: 16px !important;
            white-space: nowrap !important;
            overflow: hidden !important;
            text-overflow: ellipsis !important;
        }

        /* Правый блок с кнопками в ряд */
        .header-buttons {
            display: flex !important;
            flex-direction: row !important;
            gap: 8px !important;
            align-items: center !important;
            justify-content: flex-end !important;
            flex-shrink: 0 !important;
        }

        /* Сами кнопки в шапке */
        .header-buttons button {
            margin: 0 !important;
            height: 36px !important;
            padding: 0 12px !important;
            border-radius: 6px !important;
            font-size: 14px !important;
            border: none !important;
            cursor: pointer !important;
            white-space: nowrap !important;
            display: inline-flex !important;
            align-items: center !important;
            justify-content: center !important;
            box-sizing: border-box !important;
        }
    </style>
</head>
<body>

    <div class="auth-container" id="auth-screen">
        <div class="auth-box">
            <h2>Введите ваше имя</h2>
            <input type="text" id="username-input" placeholder="Ваше имя..." autofocus>
            <button id="login-btn">Войти</button>
        </div>
    </div>

    <div class="chat-container" id="chat-screen">
        <header>
            <div class="header-left">
                <div class="header-title" id="chat-header-title">Друг и помощник</div>
                <div class="model-selector-wrapper" id="model-selector-trigger">
                    <span class="status-dot" id="status-dot"></span>
                    <span id="active-model-name">Модель: Авто</span>
                    <div class="model-dropdown" id="model-dropdown">
                        <div class="dropdown-item active" data-model="auto">🤖 Авто (Каскад)</div>
                        <div class="dropdown-item" data-model="gemini">✨ Gemini 2.5</div>
                        <div class="dropdown-item" data-model="openrouter">🚀 OpenRouter</div>
                        <div class="dropdown-item" data-model="groq">⚡ Groq (Llama)</div>
                    </div>
                </div>
            </div>
            <div class="header-buttons">
                <button id="mail-btn" style="background-color: #4a5568 !important; color: white !important;">@@@</button>
                <button id="clear-btn" style="background-color: #e53e3e !important; color: white !important;">Очистить</button>
            </div>
        </header>
        
        <div class="messages" id="messages"></div>
        
        <div class="input-area">
            <div id="image-preview-container" class="preview-hidden">
                <img id="image-preview" src="" alt="Превью">
                <button id="cancel-image-btn">×</button>
            </div>
            <div class="input-row">
                <input type="file" id="file-input" accept="image/*" style="display: none;">
                <button id="attach-btn">📎</button>
                <textarea id="input" placeholder="Сообщение..." rows="1"></textarea>
                <button id="send-btn">➤</button>
            </div>
        </div>
    </div>

    <script>
        // Показываем любые скрытые ошибки скрипта через уведомление
        window.onerror = function(message, source, lineno) {
            alert("Ошибка скрипта: " + message + "\nЛиния: " + lineno);
            return false;
        };

        const SECRET_CODE = 'alprok8922399';
        let chatMode = 'public'; 
        let userDisplayName = ''; 
        let selectedModel = 'auto'; 

        const authScreen = document.getElementById('auth-screen');
        const chatScreen = document.getElementById('chat-screen');
        const usernameInput = document.getElementById('username-input');
        const loginBtn = document.getElementById('login-btn');
        const chatHeaderTitle = document.getElementById('chat-header-title');

        const modelTrigger = document.getElementById('model-selector-trigger');
        const modelDropdown = document.getElementById('model-dropdown');
        const activeModelName = document.getElementById('active-model-name');
        const statusDot = document.getElementById('status-dot');

        modelTrigger.addEventListener('click', (e) => {
            e.stopPropagation();
            modelDropdown.classList.toggle('show');
        });

        document.addEventListener('click', () => {
            modelDropdown.classList.remove('show');
        });

        document.querySelectorAll('.dropdown-item').forEach(item => {
            item.addEventListener('click', function() {
                document.querySelectorAll('.dropdown-item').forEach(i => i.classList.remove('active'));
                this.classList.add('active');
                selectedModel = this.getAttribute('data-model');
                
                let visibleName = "Авто";
                if(selectedModel === 'gemini') visibleName = "Gemini 2.5";
                if(selectedModel === 'openrouter') visibleName = "OpenRouter";
                if(selectedModel === 'groq') visibleName = "Groq (Llama)";
                
                activeModelName.textContent = `Модель: ${visibleName}`;
                statusDot.className = "status-dot manual"; 
            });
        });

        function updateStatusDot(backendModel) {
            statusDot.className = "status-dot"; 
            if (backendModel === 'gemini') statusDot.classList.add('gemini');
            else if (backendModel === 'openrouter') statusDot.classList.add('openrouter');
            else if (backendModel === 'groq') statusDot.classList.add('groq');
            else statusDot.classList.add('error');
        }

        function handleLogin(e) {
            if (e) {
                e.preventDefault();
                e.stopPropagation();
            }

            const enteredName = usernameInput.value.trim();
            if (!enteredName) return;

            if (enteredName === SECRET_CODE) {
                chatMode = 'private';
                userDisplayName = 'Алексей';
                chatHeaderTitle.textContent = 'Друг и помощник';
            } else {
                chatMode = 'public';
                userDisplayName = enteredName;
                chatHeaderTitle.textContent = `Чат для: ${enteredName}`;
            }

            // Жесткое переключение экранов без перезагрузок
            authScreen.style.setProperty('display', 'none', 'important');
            chatScreen.style.setProperty('display', 'flex', 'important');
            messagesContainer.innerHTML = ""; 

            if (chatMode === 'private') {
                // Загружаем историю отдельно, чтобы она не вешала вход
                setTimeout(loadChatHistory, 300);
            }
        }

        loginBtn.addEventListener('click', handleLogin);
        usernameInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') handleLogin(e);
        });

        const messagesContainer = document.getElementById('messages');
        const inputArea = document.getElementById('input');
        const sendBtn = document.getElementById('send-btn');
        const attachBtn = document.getElementById('attach-btn');
        const fileInput = document.getElementById('file-input');
        const previewContainer = document.getElementById('image-preview-container');
        const imagePreview = document.getElementById('image-preview');
        const cancelImageBtn = document.getElementById('cancel-image-btn');
        const clearBtn = document.getElementById('clear-btn');
        const mailBtn = document.getElementById('mail-btn');

        let selectedImageBase64 = "";
        let currentEditingMessageId = null; 

        inputArea.addEventListener('input', function() {
            this.style.height = 'auto';
            this.style.height = (this.scrollHeight) + 'px';
        });

        attachBtn.addEventListener('click', () => fileInput.click());
        fileInput.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = (event) => {
                selectedImageBase64 = event.target.result;
                imagePreview.src = selectedImageBase64;
                previewContainer.classList.remove('preview-hidden');
            };
            reader.readAsDataURL(file);
        });

        cancelImageBtn.addEventListener('click', () => {
            selectedImageBase64 = "";
            fileInput.value = "";
            previewContainer.classList.add('preview-hidden');
        });

        function copyCode(btn) {
            const code = btn.nextElementSibling.innerText;
            navigator.clipboard.writeText(code);
            btn.textContent = 'Скопировано!';
            setTimeout(() => btn.textContent = 'Копировать', 2000);
        }

        function formatAiText(text) {
            let rawText = text || "";
            rawText = rawText.replace(/```([\s\S]*?)```/g, (match, p1) => {
                return `<div class="code-block-wrapper">
                            <button class="copy-code-btn" onclick="copyCode(this)">Копировать</button>
                            <pre><code>${p1.trim()}</code></pre>
                        </div>`;
            });
            rawText = rawText.replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>');
            rawText = rawText.replace(/\*(.*?)\*/g, '<em>$1</em>');
            
            const lines = rawText.split('\n');
            let resultHtml = "";
            lines.forEach(line => {
                resultHtml += `<p>${line}</p>`;
            });
            return resultHtml;
        }

        function copyToClipboard(text) {
            navigator.clipboard.writeText(text);
        }

        function appendMessage(text, isUser, imageUrl = "", messageId = null) {
            if (!text && !imageUrl) return;
            const className = isUser ? 'message user' : 'message bot';
            let finalHtml = isUser ? text.replace(/\n/g, '<br>') : formatAiText(text);
            
            if (imageUrl) {
                finalHtml = `<img src="${imageUrl}" style="max-width: 100%; display: block; margin-bottom: 8px; border-radius: 8px;">` + finalHtml;
            }
            
            const wrapper = document.createElement('div');
            wrapper.className = `message-wrapper ${isUser ? 'role-user' : 'role-assistant'}`;
            if (messageId) wrapper.setAttribute('data-id', messageId);
            
            const messageDiv = document.createElement('div');
            messageDiv.className = className;
            messageDiv.innerHTML = finalHtml;
            wrapper.appendChild(messageDiv);
            
            messagesContainer.appendChild(wrapper);
            messagesContainer.scrollTop = messagesContainer.scrollHeight;
        }

        function getLocalChatHistory() {
            const wrappers = messagesContainer.querySelectorAll('.message-wrapper');
            const history = [];
            wrappers.forEach(w => {
                const isUser = w.classList.contains('role-user');
                const msgDiv = w.querySelector('.message');
                if (msgDiv) {
                    history.push({
                        role: isUser ? 'user' : 'assistant',
                        content: msgDiv.innerText || msgDiv.textContent || ""
                    });
                }
            });
            return history.slice(-10);
        }

        async function loadChatHistory() {
            try {
                const response = await fetch("https://new-1-5155.onrender.com/api/history");
                if (!response.ok) return;
                const history = await response.json();
                if (Array.isArray(history)) {
                    history.forEach(msg => {
                        if (msg) appendMessage(msg.content || msg.text || "", msg.role === 'user', "", msg.id);
                    });
                }
            } catch (e) {
                console.error(e);
            }
        }

        clearBtn.addEventListener('click', () => { messagesContainer.innerHTML = ""; });

        sendBtn.addEventListener('click', async () => {
            let text = inputArea.value.trim();
            if (!text && !selectedImageBase64) return;

            const currentDateTime = new Date().toLocaleString("ru-RU", { timeZone: "Europe/Moscow" });
            const textWithTime = `[Системное инфо: Дата/время: ${currentDateTime}. Режим: ${chatMode}]\n${text}`;
            const localHistory = getLocalChatHistory();

            appendMessage(text, true, selectedImageBase64);
            const imgToSend = selectedImageBase64;

            inputArea.value = '';
            inputArea.style.height = '40px';
            previewContainer.classList.add('preview-hidden');

            try {
                const response = await fetch("https://new-1-5155.onrender.com/api/chat", {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ 
                        text: textWithTime, 
                        image: imgToSend, 
                        mode: chatMode,
                        model: selectedModel,
                        history: localHistory
                    })
                });
                const data = await response.json();
                appendMessage(data.text, false);
                if (data.model_used) updateStatusDot(data.model_used);
            } catch (e) {
                appendMessage("Ошибка соединения.", false);
            }
        });
    </script>
</body>
</html>
