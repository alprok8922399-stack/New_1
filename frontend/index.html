<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Chat</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; background: #000000; color: #fff; height: 100vh; overflow: hidden; }
        
        /* Экран ввода имени (авторизации) */
        .auth-container {
            position: fixed;
            top: 0; left: 0; width: 100vw; height: 100vh;
            background: #000000;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            padding: 20px;
        }
        .auth-box {
            width: 100%;
            max-width: 320px;
            text-align: center;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        .auth-box h2 {
            font-size: 20px;
            font-weight: 600;
            margin-bottom: 10px;
        }
        .auth-box input {
            background: #1c1c1e;
            border: 1px solid #333;
            border-radius: 12px;
            color: #fff;
            padding: 14px;
            font-size: 16px;
            text-align: center;
            outline: none;
        }
        .auth-box button {
            background: #0a84ff;
            border: none;
            border-radius: 12px;
            color: #fff;
            padding: 14px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }
        .auth-box button:active {
            background: #0056b3;
        }

        /* Основной контейнер чата */
        .chat-container { width: 100vw; max-width: 100%; height: 100vh; margin: 0; display: flex; flex-direction: column; background: #000000; display: none; }
        
        header { 
            background: #000000; 
            padding: 12px 15px; 
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #222; 
            font-weight: bold; 
            font-size: 18px; 
            color: #fff; 
        }

        .header-title { text-align: left; }

        .clear-btn {
            background: none;
            border: 1px solid #3a3a3c;
            color: #0a84ff; 
            padding: 4px 8px; 
            border-radius: 10px; 
            font-size: 13px; 
            font-weight: normal;
            cursor: pointer;
            transition: all 0.2s ease;
        }
        .clear-btn:active { background: #0a84ff; color: #fff; }

        .messages { flex: 1; overflow-y: auto; padding: 15px; display: flex; flex-direction: column; gap: 16px; }
        .message-wrapper { display: flex; flex-direction: column; width: 100%; }
        
        .message { max-width: 90%; padding: 12px 16px; border-radius: 18px; font-size: 15px; word-wrap: break-word; font-family: inherit; }
        .message.bot { background: #1c1c1e; align-self: flex-start; border-bottom-left-radius: 4px; color: #f3f4f6; }
        .message.user { background: #2c2c2e; align-self: flex-end; border-bottom-right-radius: 4px; color: #fff; }
        
        .message p { margin-bottom: 10px; line-height: 1.45; }
        .message p:last-child { margin-bottom: 0; }
        .message strong { color: #fff; font-weight: bold; }

        /* Оформление кода */
        .code-block {
            background: #000000;
            border: 1px solid #333;
            border-radius: 8px;
            padding: 12px;
            margin: 10px 0;
            position: relative;
            overflow-x: auto;
        }
        .code-block pre { font-family: 'Courier New', monospace; font-size: 14px; color: #50fa7b; }
        .copy-code-btn {
            position: absolute;
            top: 5px;
            right: 5px;
            background: #333;
            color: #fff;
            border: none;
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 10px;
            cursor: pointer;
        }

        .message-buttons { display: flex; gap: 6px; padding: 4px 6px 0 6px; width: 100%; }
        .message-buttons button { 
            background: none; 
            border: 1px solid #000000; 
            color: #77777a; 
            cursor: pointer; 
            width: 28px; height: 28px;
            border-radius: 6px;
            display: flex; align-items: center; justify-content: center;
            transition: all 0.2s ease; padding: 0;
        }
        .message-buttons button svg { width: 16px; height: 16px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
        .message-buttons button:active { color: #0a84ff; }

        .input-area { padding: 10px; background: #000000; border-top: 1px solid #222; display: flex; flex-direction: column; gap: 5px; }
        .input-row { display: flex; align-items: flex-end; gap: 8px; }
        
        textarea { flex: 1; background: #1c1c1e; border: 1px solid #333; border-radius: 18px; color: #fff; padding: 10px 15px; outline: none; resize: none; min-height: 40px; max-height: 120px; line-height: 1.4; font-size: 16px; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
        .input-row button { background: none; border: none; color: #0a84ff; font-size: 22px; cursor: pointer; padding: 5px; }
        #attach-btn { color: #8e8e93; }

        #image-preview-container { padding: 5px; display: flex; align-items: center; gap: 10px; }
        #image-preview { max-height: 50px; border-radius: 6px; }
        .preview-hidden { display: none !important; }
        #cancel-image-btn { background: #ff3b30; color: #fff; border-radius: 50%; width: 20px; height: 20px; font-size: 12px; display: flex; justify-content: center; align-items: center; }
    </style>
</head>
<body>

    <div class="auth-container" id="auth-screen">
        <div class="auth-box">
            <h2>Введите ваше имя</h2>
            <input type="text" id="username-input" placeholder="Ваше имя..." autofocus>
            <button id="login-btn">Войти</button>
        </div>
    </div>

    <div class="chat-container" id="chat-screen">
        <header>
            <div class="header-title" id="chat-header-title">Друг и помощник</div>
            <button class="clear-btn" id="clear-btn">Очистить</button>
        </header>
        <div class="messages" id="messages"></div>
        
        <div class="input-area">
            <div id="image-preview-container" class="preview-hidden">
                <img id="image-preview" src="" alt="Превью">
                <button id="cancel-image-btn">×</button>
            </div>
            <div class="input-row">
                <input type="file" id="file-input" accept="image/*" style="display: none;">
                <button id="attach-btn">📎</button>
                <textarea id="input" placeholder="Сообщение..." rows="1"></textarea>
                <button id="send-btn">➤</button>
            </div>
        </div>
    </div>

    <script>
        const SECRET_CODE = 'alprok8922399';
        let chatMode = 'public'; 
        let userDisplayName = '';

        const authScreen = document.getElementById('auth-screen');
        const chatScreen = document.getElementById('chat-screen');
        const usernameInput = document.getElementById('username-input');
        const loginBtn = document.getElementById('login-btn');
        const chatHeaderTitle = document.getElementById('chat-header-title');
        const messagesContainer = document.getElementById('messages');
        const inputArea = document.getElementById('input');
        const sendBtn = document.getElementById('send-btn');
        const clearBtn = document.getElementById('clear-btn');
        const attachBtn = document.getElementById('attach-btn');
        const fileInput = document.getElementById('file-input');
        const previewContainer = document.getElementById('image-preview-container');
        const imagePreview = document.getElementById('image-preview');
        const cancelImageBtn = document.getElementById('cancel-image-btn');

        clearBtn.addEventListener('click', () => { messagesContainer.innerHTML = ""; });

        function handleLogin() {
            const enteredName = usernameInput.value.trim();
            if (!enteredName) return;
            userDisplayName = enteredName;
            if (enteredName === SECRET_CODE) {
                chatMode = 'private';
                chatHeaderTitle.textContent = 'Друг и помощник';
                authScreen.style.display = 'none';
                chatScreen.style.display = 'flex';
                loadChatHistory();
            } else {
                chatMode = 'public';
                chatHeaderTitle.textContent = `Чат для: ${enteredName}`;
                authScreen.style.display = 'none';
                chatScreen.style.display = 'flex';
                loadChatHistory();
            }
        }

        loginBtn.addEventListener('click', handleLogin);

        function formatAiText(text) {
            let rawText = text || "";
            rawText = rawText.replace(/```([\s\S]*?)```/g, (match, p1) => {
                const cleanCode = p1.trim();
                return `<div class="code-block"><button class="copy-code-btn" onclick="copyToClipboard(\`${cleanCode.replace(/`/g, '\\`')}\`)">Копировать</button><pre><code>${cleanCode}</code></pre></div>`;
            });
            rawText = rawText.replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>');
            rawText = rawText.replace(/\*(.*?)\*/g, '<em>$1</em>');
            return rawText.split('\n').map(p => p.trim() === "" ? '<div style="height: 8px;"></div>' : `<p>${p}</p>`).join('');
        }

        function copyToClipboard(text) { navigator.clipboard.writeText(text); }

        function appendMessage(text, isUser) {
            const div = document.createElement('div');
            div.className = 'message-wrapper';
            div.innerHTML = `<div class="message ${isUser ? 'user' : 'bot'}">${isUser ? text : formatAiText(text)}</div>`;
            messagesContainer.appendChild(div);
            messagesContainer.scrollTop = messagesContainer.scrollHeight;
        }

        async function loadChatHistory() {
            const response = await fetch("https://new-1-5155.onrender.com/api/history");
            const history = await response.json();
            messagesContainer.innerHTML = ""; 
            history.forEach(msg => appendMessage(msg.content, msg.role === 'user'));
        }

        sendBtn.addEventListener('click', async () => {
            const text = inputArea.value.trim();
            if (!text) return;
            appendMessage(text, true);
            inputArea.value = '';
            const response = await fetch("https://new-1-5155.onrender.com/api/chat", {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ text: text, mode: chatMode })
            });
            const data = await response.json();
            appendMessage(data.text, false); 
        });
    </script>
</body>
</html>
