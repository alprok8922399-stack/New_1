<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Chat</title>
  <style>
    .chat-container { display: flex; flex-direction: column; height: 90vh; max-width: 600px; margin: 0 auto; }
    #messages { flex: 1; overflow-y: auto; padding: 10px; border: 1px solid #ccc; }
    .message { margin: 10px; padding: 10px; border-radius: 10px; }
    .user { background: #e0f7fa; text-align: right; }
    .bot { background: #f5f5f5; text-align: left; }
    #form { display: flex; padding: 10px; }
    #input { flex: 1; padding: 10px; }
    button { padding: 10px 20px; }
  </style>
</head>
<body>

  <div class="chat-container">
    <div id="messages"></div>
    <form id="form">
      <input id="input" type="text" placeholder="Напиши сообщение..." required />
      <button type="submit">Отправить</button>
    </form>
  </div>

  <script src="main.js"></script>
</body>
</html>
