<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ИИ-Чат</title>
    <link rel="stylesheet" href="/styles.css">
</head>
<body class="app">
    <div class="topbar">
        <span>ИИ-Помощник</span>
    </div>

    <div id="image-preview-container" class="preview-hidden">
        <img id="image-preview" src="" alt="Превью">
        <button id="cancel-image-btn" type="button">×</button>
    </div>

    <div class="messages"></div>

    <div class="input-area">
        <input type="file" id="file-input" accept="image/*" style="display: none;">
        
        <textarea id="input" placeholder="Напиши сообщение..."></textarea>
        
        <div class="button-group">
            <button type="button" id="send-btn">Отправить</button>
            <button type="button" id="attach-btn">📎</button>
        </div>
    </div>

    <script src="/main.js"></script>
</body>
</html>
