<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AI Chat</title>
    <style>
        /* Полный и неубиваемый CSS прямо внутри файла */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html, body {
            width: 100%;
            height: 100%;
            background-color: #1a202c !important;
            color: #fff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            overflow: hidden;
        }

        /* Экран входа */
        #auth-screen {
            display: flex;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background-color: #1a202c;
            z-index: 10000;
            align-items: center;
            justify-content: center;
        }

        .auth-box {
            background: #2d3748;
            padding: 24px;
            border-radius: 12px;
            text-align: center;
            width: 90%;
            max-width: 360px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.3);
        }

        .auth-box h2 {
            margin-bottom: 16px;
            font-size: 20px;
        }

        .auth-box input {
            width: 100%;
            padding: 12px;
            border-radius: 8px;
            border: 1px solid #4a5568;
            background: #1a202c;
            color: #fff;
            margin-bottom: 16px;
            font-size: 16px;
            outline: none;
        }

        .auth-box button {
            width: 100%;
            padding: 12px;
            background: #3182ce;
            border: none;
            color: white;
            font-size: 16px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
        }

        /* Главный экран чата */
        #chat-screen {
            display: none; /* Включается через JS */
            flex-direction: column;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background-color: #1a202c;
            z-index: 9999;
        }

        /* Шапка ("Кепка") */
        header {
            display: flex;
            flex-direction: row;
            justify-content: space-between;
            align-items: center;
            padding: 0 16px;
            width: 100%;
            height: 60px;
            min-height: 60px;
            background-color: #2d3748;
            border-bottom: 1px solid #4a5568;
            flex-shrink: 0;
        }

        .header-left {
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .header-title {
            font-weight: bold;
            color: #fff;
            font-size: 16px;
        }

        /* Выбор моделей оформлен в виде красивого кликабельного селектора */
        .model-selector-wrapper {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 12px;
            color: #a0aec0;
            margin-top: 2px;
            position: relative;
        }

        .model-select-dropdown {
            background: transparent;
            color: #a0aec0;
            border: none;
            font-size: 12px;
            font-family: inherit;
            outline: none;
            cursor: pointer;
            font-weight: 500;
            padding-right: 4px;
        }

        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background-color: #48bb78;
        }

        .header-buttons {
            display: flex;
            flex-direction: row;
            gap: 8px;
            align-items: center;
        }

        .header-buttons button {
            height: 36px;
            padding: 0 12px;
            border-radius: 6px;
            font-size: 14px;
            border: none;
            cursor: pointer;
            color: white;
            font-weight: 500;
        }

        /* Зона сообщений */
        .messages {
            flex: 1;
            overflow-y: auto;
            padding: 12px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            background: #1a202c;
        }

        .message-wrapper {
            display: flex;
            flex-direction: column;
            width: 100%;
        }
        .role-user { align-items: flex-end; }
        .role-assistant { align-items: flex-start; }

        /* Базовые стили для плашек сообщений */
        .message {
            padding: 14px 16px;
            border-radius: 12px;
            font-size: 15px;
            line-height: 1.45;
            word-break: break-word;
            transition: all 0.2s ease;
        }

        /* Стиль выделения сообщений для отправки на почту */
        .message.selectable-target {
            border: 2px dashed #ecc94b !important;
            cursor: pointer;
            box-shadow: 0 0 12px rgba(236, 201, 75, 0.4);
            opacity: 0.9;
        }
        .message.selectable-target:active {
            transform: scale(0.98);
            background: #4a5568 !important;
        }

        /* Сообщение ИИ растянуто во всю ширину */
        .message.bot { 
            width: 100%;
            max-width: 100%;
            background: #2d3748; 
            color: white; 
            border-bottom-left-radius: 2px; 
        }

        /* Стили для обособленных блоков кода внутри ответов ИИ */
        .code-block-container {
            background: #1a202c;
            border: 1px solid #4a5568;
            border-radius: 8px;
            margin: 8px 0;
            overflow: hidden;
            width: 100%;
        }
        .code-block-header {
            background: #2d3748;
            padding: 6px 12px;
            font-size: 12px;
            color: #a0aec0;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #4a5568;
        }
        .code-block-copy-btn {
            background: #4a5568;
            color: #fff;
            border: none;
            padding: 4px 8px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 11px;
        }
        .code-block-content {
            padding: 12px;
            overflow-x: auto;
            font-family: monospace;
            font-size: 14px;
            white-space: pre;
            color: #e2e8f0;
            display: block;
        }

        /* Сообщение пользователя — аккуратное ограничение по высоте */
        .message.user { 
            max-width: 75%; 
            background: #3182ce; 
            color: white; 
            border-bottom-right-radius: 2px; 
            display: -webkit-box;
            -webkit-line-clamp: 3;
            -webkit-box-orient: vertical;  
            overflow: hidden;
        }

        /* Когда сообщение пользователя раскрыто по клику */
        .message.user.expanded {
            display: block;
            overflow: visible;
            max-width: 85%;
        }

        /* Кнопка стрелочки под сообщением пользователя */
        .toggle-btn {
            background: none;
            border: none;
            color: #a0aec0;
            font-size: 12px;
            cursor: pointer;
            padding: 2px 8px;
            margin-top: 2px;
            outline: none;
        }

        /* Поле ввода внизу */
        .input-area {
            padding: 12px;
            background: #2d3748;
            border-top: 1px solid #4a5568;
            flex-shrink: 0;
        }

        /* Контейнер для предпросмотра картинок */
        #image-preview-container {
            display: flex;
            align-items: center;
            gap: 10px;
            background: #1a202c;
            padding: 8px;
            border-radius: 6px;
            margin-bottom: 8px;
            border: 1px solid #4a5568;
        }

        #image-preview-container button {
            background: #e53e3e;
            color: white;
            border: none;
            border-radius: 4px;
            width: 24px;
            height: 24px;
            cursor: pointer;
            font-weight: bold;
        }

        .input-row {
            display: flex;
            gap: 8px;
            align-items: center;
        }

        .input-row textarea {
            flex: 1;
            background: #1a202c;
            border: 1px solid #4a5568;
            color: white;
            padding: 10px 12px;
            border-radius: 8px;
            resize: none;
            height: 40px;
            max-height: 120px;
            font-size: 15px;
            outline: none;
        }

        .input-row button {
            width: 40px;
            height: 40px;
            border-radius: 8px;
            border: none;
            background: #4a5568;
            color: white;
            font-size: 16px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        #send-btn { background: #3182ce; }

        .preview-hidden { display: none !important; }
    </style>
</head>
<body>

    <div id="auth-screen">
        <div class="auth-box">
            <h2>Введите ваше имя</h2>
            <input type="text" id="username-input" placeholder="Ваше имя..." autofocus>
            <button id="login-btn">Войти</button>
        </div>
    </div>

    <div id="chat-screen">
        <header>
            <div class="header-left">
                <div class="header-title" id="chat-header-title">Друг и помощник</div>
                <div class="model-selector-wrapper" id="model-selector-trigger">
                    <span class="status-dot" id="status-dot"></span>
                    <select id="model-select" class="model-select-dropdown">
                        <option value="gemini" style="background: #2d3748; color: #fff;">Модель: Gemini</option>
                        <option value="openrouter" style="background: #2d3748; color: #fff;">Модель: OpenRouter</option>
                        <option value="groq" style="background: #2d3748; color: #fff;">Модель: GROQ</option>
                    </select>
                </div>
            </div>
            <div class="header-buttons">
                <button id="mail-btn" style="background-color: #4a5568;">@@@</button>
                <button id="clear-btn" style="background-color: #e53e3e;">Очистить</button>
            </div>
        </header>
        
        <div class="messages" id="messages"></div>
        
        <div class="input-area">
            <div id="image-preview-container" class="preview-hidden">
                <img id="image-preview" src="" alt="Превью" style="max-height: 60px; border-radius: 4px;">
                <button id="cancel-image-btn">×</button>
            </div>
            <div class="input-row">
                <input type="file" id="file-input" accept="image/*" style="display: none;">
                <button id="attach-btn">📎</button>
                <textarea id="input" placeholder="Сообщение..." rows="1"></textarea>
                <button id="send-btn">➤</button>
            </div>
        </div>
    </div>

    <script>
        window.onerror = function(message, source, lineno) {
            console.log("Ошибка перехвачена: " + message);
            return true; 
        };

        const SECRET_CODE = 'ю';
        let chatMode = 'public'; 
        let userDisplayName = ''; 
        let selectedModel = 'gemini'; // По умолчанию установлена модель Gemini
        let isEmailSelectionMode = false; 

        const authScreen = document.getElementById('auth-screen');
        const chatScreen = document.getElementById('chat-screen');
        const usernameInput = document.getElementById('username-input');
        const loginBtn = document.getElementById('login-btn');
        const chatHeaderTitle = document.getElementById('chat-header-title');
        const messagesContainer = document.getElementById('messages');
        const inputArea = document.getElementById('input');
        const sendBtn = document.getElementById('send-btn');
        const clearBtn = document.getElementById('clear-btn');
        
        const modelSelectorTrigger = document.getElementById('model-selector-trigger');
        const modelSelectElement = document.getElementById('model-select');
        const mailBtn = document.getElementById('mail-btn');

        const attachBtn = document.getElementById('attach-btn');
        const fileInput = document.getElementById('file-input');
        const previewContainer = document.getElementById('image-preview-container');
        const imagePreview = document.getElementById('image-preview');
        const cancelImageBtn = document.getElementById('cancel-image-btn');
        let selectedImageBase64 = "";

        inputArea.addEventListener('input', function() {
            this.style.height = 'auto';
            this.style.height = (this.scrollHeight) + 'px';
        });

        attachBtn.addEventListener('click', () => fileInput.click());
        fileInput.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = (event) => {
                selectedImageBase64 = event.target.result;
                imagePreview.src = selectedImageBase64;
                previewContainer.classList.remove('preview-hidden');
            };
            reader.readAsDataURL(file);
        });

        cancelImageBtn.addEventListener('click', () => {
            selectedImageBase64 = "";
            fileInput.value = "";
            previewContainer.classList.add('preview-hidden');
        });

        // Слушатель изменения модели в выпадающем списке
        modelSelectElement.addEventListener('change', (e) => {
            selectedModel = e.target.value;
        });

        function handleLogin(e) {
            if (e) e.preventDefault();

            const enteredName = usernameInput.value.trim();
            if (!enteredName) return;

            if (enteredName === SECRET_CODE) {
                chatMode = 'private';
                userDisplayName = 'Алексей';
                chatHeaderTitle.textContent = 'Друг и помощник';
                
                modelSelectorTrigger.style.display = 'flex';
                mailBtn.style.display = 'block';
            } else {
                chatMode = 'public';
                userDisplayName = enteredName;
                chatHeaderTitle.textContent = `Гость: ${enteredName}`;
                
                modelSelectorTrigger.style.display = 'none';
                mailBtn.style.display = 'none';
            }

            authScreen.style.display = 'none';
            chatScreen.style.display = 'flex';
            messagesContainer.innerHTML = ""; 

            if (chatMode === 'private') {
                loadChatHistory().catch(err => console.log("История недоступна"));
            }
        }

        loginBtn.addEventListener('click', handleLogin);
        usernameInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') handleLogin(e);
        });

        async function loadChatHistory() {
            try {
                const response = await fetch("https://new-1-5155.onrender.com/api/history");
                if (!response.ok) return;
                const history = await response.json();
                if (Array.isArray(history)) {
                    history.forEach(msg => {
                        if (msg) appendMessage(msg.content || msg.text || "", msg.role === 'user');
                    });
                }
            } catch (e) {
                console.error("Ошибка сети при загрузке истории:", e);
            }
        }

        function formatBotMessageWithCode(text) {
            const regex = /`{3}(?:[a-zA-Z0-9_-]+)?\n([\s\S]*?)\n`{3}/g;
            let parts = [];
            let lastIndex = 0;
            let match;

            while ((match = regex.exec(text)) !== null) {
                if (match.index > lastIndex) {
                    parts.push({ type: 'text', content: text.substring(lastIndex, match.index) });
                }
                parts.push({ type: 'code', content: match[1] });
                lastIndex = regex.lastIndex;
            }

            if (lastIndex < text.length) {
                parts.push({ type: 'text', content: text.substring(lastIndex) });
            }

            return parts;
        }

        function appendMessage(text, isUser, imageUrl = "") {
            if (!text && !imageUrl) return;
            const className = isUser ? 'message user' : 'message bot';
            
            const wrapper = document.createElement('div');
            wrapper.className = `message-wrapper ${isUser ? 'role-user' : 'role-assistant'}`;
            
            const messageDiv = document.createElement('div');
            messageDiv.className = className;
            
            if (imageUrl) {
                messageDiv.innerHTML = `<img src="${imageUrl}" style="max-width: 100%; display: block; margin-bottom: 8px; border-radius: 8px;">`;
                const textNode = document.createTextNode(text);
                messageDiv.appendChild(textNode);
            } else if (isUser) {
                messageDiv.innerText = text;
            } else {
                const fragments = formatBotMessageWithCode(text);
                if (fragments.length === 0) {
                    messageDiv.innerText = text;
                } else {
                    fragments.forEach(frag => {
                        if (frag.type === 'text') {
                            const span = document.createElement('span');
                            span.innerText = frag.content;
                            messageDiv.appendChild(span);
                        } else if (frag.type === 'code') {
                            const container = document.createElement('div');
                            container.className = 'code-block-container';

                            const headerDiv = document.createElement('div');
                            headerDiv.className = 'code-block-header';
                            headerDiv.innerHTML = '<span>Код</span>';

                            const copyBtn = document.createElement('button');
                            copyBtn.className = 'code-block-copy-btn';
                            copyBtn.innerText = 'Копировать';
                            copyBtn.addEventListener('click', () => {
                                navigator.clipboard.writeText(frag.content).then(() => {
                                    copyBtn.innerText = 'Скопировано!';
                                    setTimeout(() => { copyBtn.innerText = 'Копировать'; }, 2000);
                                });
                            });

                            headerDiv.appendChild(copyBtn);
                            container.appendChild(headerDiv);

                            const codeEl = document.createElement('code');
                            codeEl.className = 'code-block-content';
                            codeEl.innerText = frag.content;
                            container.appendChild(codeEl);

                            messageDiv.appendChild(container);
                        }
                    });
                }
            }
            
            messageDiv.addEventListener('click', () => {
                if (!isEmailSelectionMode || !messageDiv.classList.contains('selectable-target')) return;
                
                const messageTextToEmail = messageDiv.innerText;
                sendEmailViaFormSubmit(messageTextToEmail);
            });

            wrapper.appendChild(messageDiv);

            if (isUser && text.length > 60) {
                const toggleBtn = document.createElement('button');
                toggleBtn.className = 'toggle-btn';
                toggleBtn.innerText = '▼';
                
                toggleBtn.addEventListener('click', () => {
                    if (messageDiv.classList.contains('expanded')) {
                        messageDiv.classList.remove('expanded');
                        toggleBtn.innerText = '▼';
                    } else {
                        messageDiv.classList.add('expanded');
                        toggleBtn.innerText = '▲';
                    }
                });
                wrapper.appendChild(toggleBtn);
            }
            
            messagesContainer.appendChild(wrapper);
            messagesContainer.scrollTop = messagesContainer.scrollHeight;
        }

        mailBtn.addEventListener('click', () => {
            const allElements = document.querySelectorAll('.message');
            if (allElements.length === 0) return;

            if (isEmailSelectionMode) {
                cancelEmailSelection();
                return;
            }

            isEmailSelectionMode = true;
            mailBtn.style.backgroundColor = '#ecc94b'; 

            const elementsArray = Array.from(allElements);
            const targets = elementsArray.slice(-5);

            targets.forEach(el => {
                el.classList.add('selectable-target');
            });
        });

        function cancelEmailSelection() {
            isEmailSelectionMode = false;
            mailBtn.style.backgroundColor = '#4a5568';
            document.querySelectorAll('.message').forEach(el => {
                el.classList.remove('selectable-target');
            });
        }

        async function sendEmailViaFormSubmit(messageText) {
            mailBtn.innerText = '...';
            
            try {
                const response = await fetch("https://formsubmit.co/ajax/alprok8922399@proton.me", {
                    method: "POST",
                    headers: { 
                        "Content-Type": "application/json",
                        "Accept": "application/json"
                    },
                    body: JSON.stringify({
                        "Тема": "Выбранное сообщение из AI Chat",
                        "Сообщение": messageText
                    })
                });

                if (response.ok) {
                    alert("Сообщение успешно отправлено на вашу почту! 📬");
                } else {
                    alert("Не удалось отправить через FormSubmit.");
                }
            } catch (err) {
                alert("Ошибка сети при отправке почты.");
            } finally {
                mailBtn.innerText = '@@@';
                cancelEmailSelection();
            }
        }

        clearBtn.addEventListener('click', () => { messagesContainer.innerHTML = ""; });

        sendBtn.addEventListener('click', async () => {
            let text = inputArea.value.trim();
            if (!text && !selectedImageBase64) return;

            appendMessage(text, true, selectedImageBase64);
            
            const imgToSend = selectedImageBase64;
            
            inputArea.value = '';
            inputArea.style.height = '40px';
            selectedImageBase64 = "";
            fileInput.value = "";
            previewContainer.classList.add('preview-hidden');

            const clientTime = new Date().toLocaleString('ru-RU');
            const payloadText = `[Системное инфо: Текущие дата и время: ${clientTime}, Имя собеседника: ${userDisplayName}] ${text}`;

            try {
                const response = await fetch("https://new-1-5155.onrender.com/api/chat", {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ 
                        text: payloadText, 
                        image: imgToSend, 
                        mode: chatMode,
                        model: selectedModel
                    })
                });
                const data = await response.json();
                appendMessage(data.text, false);
            } catch (e) {
                appendMessage("Ошибка соединения с сервером.", false);
            }
        });
    </script>
</body>
</html>
