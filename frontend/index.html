<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ИИ Чат с Памятью</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #111418; /* Тёмный фон вокруг чата */
            color: #f3f4f6;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .chat-container {
            width: 100%;
            max-width: 480px;
            height: 100vh;
            background: #181c22; /* Тёмный фон самого чата */
            display: flex;
            flex-direction: column;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }

        .messages {
            flex: 1;
            overflow-y: auto;
            padding: 15px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            background-color: #111418; /* Тёмный фон окна сообщений */
        }

        .message {
            max-width: 85%;
            padding: 12px 16px;
            border-radius: 16px;
            font-size: 15px;
            line-height: 1.5;
            word-wrap: break-word;
        }

        /* Стиль бота (Графитовый) */
        .message.bot {
            background-color: #22272f;
            color: #e5e7eb;
            align-self: flex-start;
            border: 1px solid #2d3540;
            border-bottom-left-radius: 4px;
        }

        .message.bot p {
            margin-bottom: 10px;
        }
        .message.bot p:last-child {
            margin-bottom: 0;
        }

        .message.bot strong {
            color: #ffffff;
            font-weight: 600;
        }

        .message.bot hr {
            border: 0;
            border-top: 1px solid #2d3540;
            margin: 12px 0;
        }

        /* Стиль пользователя (Синий) */
        .message.user {
            background-color: #007aff;
            color: #fff;
            align-self: flex-end;
            border-bottom-right-radius: 4px;
        }

        /* Тёмная зона ввода */
        .input-container {
            padding: 10px;
            background: #181c22;
            border-top: 1px solid #2d3540;
            display: flex;
            align-items: flex-end;
            gap: 8px;
        }

        textarea {
            flex: 1;
            resize: none;
            height: 40px;
            max-height: 120px;
            padding: 10px 12px;
            background-color: #22272f;
            border: 1px solid #2d3540;
            color: #fff;
            border-radius: 20px;
            font-size: 15px;
            outline: none;
            font-family: inherit;
        }

        textarea::placeholder {
            color: #718096;
        }

        button {
            background: #007aff;
            color: #fff;
            border: none;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            font-size: 18px;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-shrink: 0;
        }

        button:active {
            background: #0056b3;
        }

        #attach-btn {
            background: #22272f;
            color: #a0aec0;
        }

        #attach-btn:active {
            background: #2d3540;
        }

        #image-preview-container {
            padding: 8px 15px;
            background: #181c22;
            border-top: 1px solid #2d3540;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        #image-preview {
            max-height: 60px;
            border-radius: 8px;
            object-fit: cover;
        }

        .preview-hidden {
            display: none !important;
        }

        #cancel-image-btn {
            background: #ff3b30;
            width: 24px;
            height: 24px;
            font-size: 12px;
        }
    </style>
</head>
<body>

    <div class="chat-container">
        <div class="messages" id="messages"></div>

        <div id="image-preview-container" class="preview-hidden">
            <img id="image-preview" src="" alt="Превью">
            <button id="cancel-image-btn">X</button>
        </div>

        <div class="input-container">
            <button id="attach-btn">📎</button>
            <input type="file" id="file-input" accept="image/*" style="display: none;">
            
            <textarea id="input" placeholder="Напишите сообщение..." rows="1"></textarea>
            
            <button id="send-btn">📌</button>
        </div>
    </div>

    <script src="main.js"></script>
</body>
</html>
