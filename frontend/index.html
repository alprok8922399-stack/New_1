<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Chat</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: -apple-system, sans-serif; background: #111; color: #fff; height: 100vh; overflow: hidden; }
        .chat-container { width: 100%; max-width: 500px; height: 100vh; margin: 0 auto; display: flex; flex-direction: column; background: #1a1a1a; }
        
        .messages { flex: 1; overflow-y: auto; padding: 15px; display: flex; flex-direction: column; gap: 10px; }
        .message { max-width: 85%; padding: 10px 14px; border-radius: 18px; font-size: 15px; }
        .message.bot { background: #2c2c2e; align-self: flex-start; border-bottom-left-radius: 4px; }
        .message.user { background: #444; align-self: flex-end; border-bottom-right-radius: 4px; }
        
        .input-area { padding: 10px; background: #1a1a1a; border-top: 1px solid #333; display: flex; align-items: flex-end; gap: 8px; }
        textarea { flex: 1; background: #2c2c2e; border: 1px solid #444; border-radius: 18px; color: #fff; padding: 10px 15px; outline: none; resize: none; min-height: 40px; max-height: 120px; line-height: 1.4; }
        button { background: none; border: none; color: #0a84ff; font-size: 22px; cursor: pointer; padding: 5px; }
    </style>
</head>
<body>
    <div class="chat-container">
        <div class="messages" id="messages"></div>
        <div class="input-area">
            <input type="file" id="file-input" accept="image/*" style="display: none;">
            <button id="attach-btn">📎</button>
            <textarea id="input" placeholder="Сообщение..." rows="1"></textarea>
            <button id="send-btn">➤</button>
        </div>
    </div>
    <script src="main.js"></script>
</body>
</html>
