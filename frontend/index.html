<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Chat</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; background: #000000; color: #fff; height: 100vh; overflow: hidden; }
        
        .auth-container { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: #000000; display: flex; flex-direction: column; justify-content: center; align-items: center; z-index: 9999; padding: 20px; }
        .auth-box { width: 100%; max-width: 320px; text-align: center; display: flex; flex-direction: column; gap: 15px; }
        .auth-box input { background: #1c1c1e; border: 1px solid #333; border-radius: 12px; color: #fff; padding: 14px; font-size: 16px; text-align: center; outline: none; }
        .auth-box button { background: #0a84ff; border: none; border-radius: 12px; color: #fff; padding: 14px; font-size: 16px; font-weight: bold; cursor: pointer; }
        
        .chat-container { width: 100vw; max-width: 100%; height: 100vh; display: flex; flex-direction: column; background: #000000; display: none; }
        header { padding: 12px 15px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #222; font-weight: bold; font-size: 18px; }
        .clear-btn { background: none; border: 1px solid #3a3a3c; color: #0a84ff; padding: 4px 8px; border-radius: 10px; font-size: 13px; cursor: pointer; }
        .messages { flex: 1; overflow-y: auto; padding: 15px; display: flex; flex-direction: column; gap: 16px; }
        .message-wrapper { display: flex; flex-direction: column; width: 100%; }
        
        .message { max-width: 90%; padding: 12px 16px; border-radius: 18px; font-size: 15px; word-wrap: break-word; white-space: pre-wrap; line-height: 1.4; }
        .message.bot { background: #1c1c1e; align-self: flex-start; border-bottom-left-radius: 4px; color: #f3f4f6; }
        .message.user { background: #2c2c2e; align-self: flex-end; border-bottom-right-radius: 4px; color: #fff; }
        
        /* Простые и надежные стили блоков кода */
        .code-container {
            background: #000000;
            border: 1px solid #333;
            border-radius: 10px;
            padding: 10px;
            margin: 8px 0;
            position: relative;
        }
        .code-text {
            font-family: 'Courier New', monospace;
            font-size: 14px;
            color: #50fa7b;
            overflow-x: auto;
            white-space: pre;
            padding-top: 20px;
        }
        .copy-btn {
            position: absolute;
            top: 5px;
            right: 5px;
            background: #2c2c2e;
            color: #0a84ff;
            border: 1px solid #333;
            padding: 2px 6px;
            border-radius: 5px;
            font-size: 11px;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <div class="auth-container" id="auth-screen">
        <div class="auth-box">
            <h2>Введите ваше имя</h2>
            <input type="text" id="username-input" placeholder="Как вас зовут?" autofocus>
            <button id="login-btn">Войти</button>
        </div>
    </div>
    <div class="chat-container" id="chat-screen">
        <header>
            <div id="chat-header-title">Чат</div>
            <button class="clear-btn" id="clear-btn">Очистить</button>
        </header>
        <div class="messages" id="messages"></div>
        <div class="input-area">
            <div class="input-row">
                <textarea id="input" placeholder="Сообщение..." rows="1"></textarea>
                <button id="send-btn">➤</button>
            </div>
        </div>
    </div>
    <script>
        const SECRET_CODE = 'alprok8922399';
        let chatMode = 'public'; 
        let userDisplayName = 'Гость';

        const authScreen = document.getElementById('auth-screen');
        const chatScreen = document.getElementById('chat-screen');
        const messagesContainer = document.getElementById('messages');
        const inputArea = document.getElementById('input');
        const sendBtn = document.getElementById('send-btn');
        const clearBtn = document.getElementById('clear-btn');
        const headerTitle = document.getElementById('chat-header-title');

        clearBtn.addEventListener('click', () => {
            messagesContainer.innerHTML = "";
        });

        document.getElementById('login-btn').addEventListener('click', () => {
            const inputVal = document.getElementById('username-input').value.trim();
            if (inputVal === SECRET_CODE) {
                chatMode = 'private';
                userDisplayName = 'Алексей';
                headerTitle.textContent = 'Друг и помощник';
                clearBtn.style.display = 'block';
            } else {
                chatMode = 'public';
                userDisplayName = inputVal || 'Гость';
                headerTitle.textContent = 'Публичный чат';
                clearBtn.style.display = 'none';
            }
            authScreen.style.display = 'none';
            chatScreen.style.display = 'flex';
            loadChatHistory();
        });

        async function loadChatHistory() {
            if (chatMode === 'public') return;
            const response = await fetch("https://new-1-5155.onrender.com/api/history?mode=private");
            const history = await response.json();
            messagesContainer.innerHTML = ""; 
            history.forEach(msg => appendMessage(msg.content, msg.role === 'user'));
        }

        // Простой и супер-надежный разделитель кода
        function parseBotMessage(el, text) {
            const parts = text.split('```');
            for (let i = 0; i < parts.length; i++) {
                if (i % 2 === 0) {
                    // Обычный текст
                    if (parts[i]) {
                        const span = document.createElement('span');
                        span.textContent = parts[i];
                        el.appendChild(span);
                    }
                } else {
                    // Блок кода
                    const codeContainer = document.createElement('div');
                    codeContainer.className = 'code-container';
                    
                    const copyBtn = document.createElement('button');
                    copyBtn.className = 'copy-btn';
                    copyBtn.textContent = 'Копировать';
                    
                    const codeDiv = document.createElement('div');
                    codeDiv.className = 'code-text';
                    
                    // Чистим имя языка программирования из первой строчки, если оно есть
                    let codeContent = parts[i];
                    if (codeContent.startsWith('python\n')) codeContent = codeContent.substring(7);
                    else if (codeContent.startsWith('javascript\n')) codeContent = codeContent.substring(11);
                    else if (codeContent.startsWith('java\n')) codeContent = codeContent.substring(5);
                    else if (codeContent.startsWith('cpp\n')) codeContent = codeContent.substring(4);
                    else if (codeContent.startsWith('html\n')) codeContent = codeContent.substring(5);
                    else if (codeContent.startsWith('css\n')) codeContent = codeContent.substring(4);
                    
                    codeDiv.textContent = codeContent;
                    
                    copyBtn.addEventListener('click', () => {
                        navigator.clipboard.writeText(codeContent).then(() => {
                            copyBtn.textContent = 'Скопировано!';
                            setTimeout(() => { copyBtn.textContent = 'Копировать'; }, 2000);
                        });
                    });
                    
                    codeContainer.appendChild(copyBtn);
                    codeContainer.appendChild(codeDiv);
                    el.appendChild(codeContainer);
                }
            }
        }

        function appendMessage(text, isUser) {
            const div = document.createElement('div');
            div.className = 'message-wrapper';
            
            const msgDiv = document.createElement('div');
            msgDiv.className = `message ${isUser ? 'user' : 'bot'}`;
            
            if (isUser) {
                msgDiv.textContent = text;
            } else {
                parseBotMessage(msgDiv, text);
            }
            
            div.appendChild(msgDiv);
            messagesContainer.appendChild(div);
            messagesContainer.scrollTop = messagesContainer.scrollHeight;
        }

        sendBtn.addEventListener('click', async () => {
            const text = inputArea.value.trim();
            if (!text) return;
            appendMessage(text, true);
            inputArea.value = '';

            const now = new Date();
            const timeString = now.toLocaleString('ru-RU');

            const response = await fetch("[https://new-1-5155.onrender.com/api/chat](https://new-1-5155.onrender.com/api/chat)", {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ 
                    text: text, 
                    mode: chatMode, 
                    user: userDisplayName,
                    client_time: timeString
                })
            });
            const data = await response.json();
            appendMessage(data.text, false); 
        });
    </script>
</body>
</html>
