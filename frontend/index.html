<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>AI Chat</title>

  <link rel="stylesheet" href="./styles.css" />

  <!-- Markdown -->
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

  <!-- Highlight.js -->
  <link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github-dark.min.css"
  />

  <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
</head>

<body>
  <div class="app">

    <header class="topbar">
      <div class="title">💬 AI Chat</div>

      <div class="actions">

        <button id="privateBtn" class="btn" type="button">
          🔒 Приватный
        </button>

        <select id="autoClearSelect" class="btn">
          <option value="0">🗑 Очистка: Никогда</option>
          <option value="1">🗑 Через 1 минуту</option>
          <option value="5">🗑 Через 5 минут</option>
          <option value="10">🗑 Через 10 минут</option>
          <option value="30">🗑 Через 30 минут</option>
          <option value="60">🗑 Через 1 час</option>
        </select>

      </div>
    </header>

    <main id="messages" class="messages"></main>

    <form id="form" class="input-area">
      <input
        id="input"
        type="text"
        autocomplete="off"
        placeholder="Напишите сообщение..."
      />

      <button type="submit">➤</button>
    </form>

  </div>

  <script src="./main.js"></script>
</body>
</html>
