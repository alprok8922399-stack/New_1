<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Chat</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #000; color: #fff; height: 100vh; overflow: hidden; }
        
        .screen { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; display: flex; flex-direction: column; justify-content: center; align-items: center; background: #000; padding: 20px; z-index: 1000; }
        .input-box { width: 100%; max-width: 350px; display: flex; flex-direction: column; gap: 15px; }
        input { background: #1c1c1e; border: 1px solid #333; border-radius: 12px; color: #fff; padding: 15px; font-size: 16px; outline: none; }
        button { background: #0a84ff; border: none; border-radius: 12px; color: #fff; padding: 15px; font-size: 16px; font-weight: bold; cursor: pointer; }

        #chat-screen { display: none; flex-direction: column; height: 100vh; background: #000; }
        .messages { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 15px; }
        .msg { padding: 10px 0; line-height: 1.5; }
        .msg.user { align-self: flex-end; background: #2c2c2e; padding: 12px 16px; border-radius: 18px 18px 4px 18px; max-width: 85%; }
        .msg.bot { align-self: flex-start; max-width: 100%; width: 100%; }
        
        .input-area { padding: 15px; border-top: 1px solid #222; display: flex; gap: 10px; }
        textarea { flex: 1; background: #1c1c1e; border: 1px solid #333; border-radius: 18px; color: #fff; padding: 12px; outline: none; resize: none; height: 45px; }
        
        pre { background: #000; border: 1px solid #444; padding: 15px; border-radius: 10px; overflow-x: auto; margin: 10px 0; }
    </style>
</head>
<body>

<div id="auth-screen" class="screen">
    <div class="input-box">
        <input type="text" id="username" placeholder="Введите имя...">
        <button onclick="login()">Войти</button>
    </div>
</div>

<div id="chat-screen" class="screen" style="display: none; justify-content: flex-start;">
    <div id="messages" class="messages" style="width: 100%; max-width: 800px;"></div>
    <div class="input-area" style="width: 100%; max-width: 800px;">
        <textarea id="input" placeholder="Сообщение..."></textarea>
        <button onclick="send()">➤</button>
    </div>
</div>

<script>
    const URL = 'https://new-1-5155.onrender.com';
    let user = '';

    function login() {
        const name = document.getElementById('username').value.trim();
        if(!name) return;
        user = name;
        document.getElementById('auth-screen').style.display = 'none';
        document.getElementById('chat-screen').style.display = 'flex';
    }

    async function send() {
        const input = document.getElementById('input');
        const text = input.value.trim();
        if(!text) return;
        
        const container = document.getElementById('messages');
        container.innerHTML += `<div class="msg user">${text}</div>`;
        input.value = '';

        try {
            const res = await fetch(`${URL}/api/chat`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ text: text })
            });
            const data = await res.json();
            let botText = (data.text || data.message || "Ошибка ответа").replace(/```([\s\S]*?)```/g, '<pre>$1</pre>');
            container.innerHTML += `<div class="msg bot">${botText}</div>`;
            container.scrollTop = container.scrollHeight;
        } catch(e) {
            container.innerHTML += `<div class="msg bot" style="color:red">Ошибка сети. Сервер спит?</div>`;
        }
    }
</script>
</body>
</html>
