<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>AI Chat</title>

  <link rel="stylesheet" href="./styles.css" />

  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
</head>

<body>

<div id="loginScreen" style="
position:fixed;
inset:0;
background:#0f0f0f;
display:flex;
align-items:center;
justify-content:center;
z-index:9999;
">

  <div style="
  width:90%;
  max-width:400px;
  background:#1a1a1a;
  padding:20px;
  border-radius:12px;
  ">

    <h2 style="margin-top:0;">Вход в чат</h2>

    <p>Введите ваше имя</p>

    <input
      id="loginInput"
      type="text"
      placeholder="Имя или фраза"
      style="
      width:100%;
      padding:12px;
      border:none;
      border-radius:8px;
      background:#2a2a2a;
      color:white;
      box-sizing:border-box;
      "
    />

    <button
      id="loginBtn"
      style="
      width:100%;
      margin-top:10px;
      padding:12px;
      border:none;
      border-radius:8px;
      background:#333;
      color:white;
      cursor:pointer;
      "
    >
      Войти
    </button>

  </div>

</div>

<div class="app">

  <header class="topbar">
    <div class="title">💬 AI Chat</div>

    <div class="actions">

      <button id="btnPrivate" class="btn" type="button">
        🔒 Приватный
      </button>

      <select id="clearTimer" class="btn">
        <option value="">🧹 Очистить</option>
        <option value="now">Очистить сейчас</option>
        <option value="1">Через 1 минуту</option>
        <option value="5">Через 5 минут</option>
        <option value="10">Через 10 минут</option>
        <option value="30">Через 30 минут</option>
        <option value="60">Через 1 час</option>
      </select>

    </div>
  </header>

  <main id="messages" class="messages"></main>

  <form id="form" class="input-area">

    <textarea
      id="input"
      autocomplete="off"
      placeholder="Напишите сообщение..."
      rows="1"
    ></textarea>

    <button type="submit">➤</button>

  </form>

</div>

<script src="./main.js"></script>

</body>
</html>
