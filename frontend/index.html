<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Chat</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; background: #000000; color: #fff; height: 100vh; overflow: hidden; }
        .chat-container { width: 100vw; max-width: 100%; height: 100vh; margin: 0; display: flex; flex-direction: column; background: #000000; }
        
        header { background: #000000; padding: 15px; text-align: center; border-bottom: 1px solid #222; font-weight: bold; font-size: 18px; color: #fff; }

        .messages { flex: 1; overflow-y: auto; padding: 15px; display: flex; flex-direction: column; gap: 16px; }
        
        /* Контейнер для сообщения и его кнопок */
        .message-wrapper { display: flex; flex-direction: column; width: 100%; }
        
        .message { max-width: 90%; padding: 12px 16px; border-radius: 18px; font-size: 15px; word-wrap: break-word; font-family: inherit; }
        .message.bot { background: #1c1c1e; align-self: flex-start; border-bottom-left-radius: 4px; color: #f3f4f6; }
        .message.user { background: #2c2c2e; align-self: flex-end; border-bottom-right-radius: 4px; color: #fff; }
        
        .message p { margin-bottom: 10px; line-height: 1.45; }
        .message p:last-child { margin-bottom: 0; }
        .message strong { color: #fff; font-weight: bold; }

        /* Стильные контурные серые кнопки */
        .message-buttons { display: flex; gap: 6px; padding: 4px 6px 0 6px; width: 100%; }
        .message-buttons button { 
            background: none; 
            border: 1px solid #3a3a3c; 
            color: #77777a; 
            cursor: pointer; 
            width: 28px;
            height: 28px;
            border-radius: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s ease;
            padding: 0;
        }
        
        /* Стили для SVG-контуров внутри кнопок */
        .message-buttons button svg {
            width: 16px;
            height: 16px;
            stroke: currentColor; 
            fill: none;
            stroke-width: 2;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        .message-buttons button:active { 
            border-color: #0a84ff; 
            color: #0a84ff; 
        }

        .input-area { padding: 10px; background: #000000; border-top: 1px solid #222; display: flex; flex-direction: column; gap: 5px; }
        .input-row { display: flex; align-items: flex-end; gap: 8px; }
        
        textarea { flex: 1; background: #1c1c1e; border: 1px solid #333; border-radius: 18px; color: #fff; padding: 10px 15px; outline: none; resize: none; min-height: 40px; max-height: 120px; line-height: 1.4; font-size: 16px; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
        .input-row button { background: none; border: none; color: #0a84ff; font-size: 22px; cursor: pointer; padding: 5px; }
        #attach-btn { color: #8e8e93; }

        #image-preview-container { padding: 5px; display: flex; align-items: center; gap: 10px; }
        #image-preview { max-height: 50px; border-radius: 6px; }
        .preview-hidden { display: none !important; }
        #cancel-image-btn { background: #ff3b30; color: #fff; border-radius: 50%; width: 20px; height: 20px; font-size: 12px; display: flex; justify-content: center; align-items: center; }
    </style>
</head>
<body>
    <div class="chat-container">
        <header>Друг и помощник</header>
        <div class="messages" id="messages"></div>
        
        <div class="input-area">
            <div id="image-preview-container" class="preview-hidden">
                <img id="image-preview" src="" alt="Превью">
                <button id="cancel-image-btn">×</button>
            </div>
            <div class="input-row">
                <input type="file" id="file-input" accept="image/*" style="display: none;">
                <button id="attach-btn">📎</button>
                <textarea id="input" placeholder="Сообщение..." rows="1"></textarea>
                <button id="send-btn">➤</button>
            </div>
        </div>
    </div>

    <script>
        const messagesContainer = document.getElementById('messages');
        const inputArea = document.getElementById('input');
        const sendBtn = document.getElementById('send-btn');
        const attachBtn = document.getElementById('attach-btn');
        const fileInput = document.getElementById('file-input');
        const previewContainer = document.getElementById('image-preview-container');
        const imagePreview = document.getElementById('image-preview');
        const cancelImageBtn = document.getElementById('cancel-image-btn');

        let selectedImageBase64 = "";
        let currentEditingMessageId = null; 

        inputArea.addEventListener('input', function() {
            this.style.height = 'auto';
            this.style.height = (this.scrollHeight) + 'px';
        });

        attachBtn.addEventListener('click', () => fileInput.click());
        fileInput.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = (event) => {
                selectedImageBase64 = event.target.result;
                imagePreview.src = selectedImageBase64;
                previewContainer.classList.remove('preview-hidden');
            };
            reader.readAsDataURL(file);
        });

        cancelImageBtn.addEventListener('click', () => {
            selectedImageBase64 = "";
            fileInput.value = "";
            previewContainer.classList.add('preview-hidden');
        });

        function formatAiText(text) {
            let rawText = text || "";
            rawText = rawText.replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>');
            rawText = rawText.replace(/\*(.*?)\*/g, '<em>$1</em>');
            
            const paragraphs = rawText.split('\n');
            return paragraphs.map(p => {
                if (p.trim() === "") return '<div style="height: 8px;"></div>';
                return `<p>${p}</p>`;
            }).join('');
        }

        // Убрали отсюда строчку с раздражающим алертом
        function copyToClipboard(text) {
            navigator.clipboard.writeText(text).catch(err => {
                console.error('Не удалось скопировать: ', err);
            });
        }

        function appendMessage(text, isUser, imageUrl = "", messageId = null) {
            if ((!text || text.trim() === "") && !imageUrl) return;

            const className = isUser ? 'message user' : 'message bot';
            let finalHtml = isUser ? text.replace(/\n/g, '<br>') : formatAiText(text);
            
            if (imageUrl) {
                finalHtml = `<img src="${imageUrl}" style="max-width: 100%; display: block; margin-bottom: 8px; border-radius: 8px;">` + finalHtml;
            }
            
            const wrapper = document.createElement('div');
            wrapper.className = 'message-wrapper';
            if (messageId) {
                wrapper.setAttribute('data-id', messageId); 
            }
            
            const messageDiv = document.createElement('div');
            messageDiv.className = className;
            messageDiv.innerHTML = finalHtml;
            wrapper.appendChild(messageDiv);
            
            const buttonsDiv = document.createElement('div');
            buttonsDiv.className = 'message-buttons';
            
            if (isUser) {
                buttonsDiv.style.justifyContent = 'flex-end';
                buttonsDiv.innerHTML = `
                    <button class="btn-edit" title="Редактировать">
                        <svg viewBox="0 0 24 24"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7M18.5 2.5a2.121 2.121 0 1 1 3 3L12 15l-4 1 1-4Z"/></svg>
                    </button>
                    <button class="btn-copy" title="Копировать">
                        <svg viewBox="0 0 24 24"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
                    </button>
                `;
            } else {
                buttonsDiv.style.justifyContent = 'flex-start';
                buttonsDiv.innerHTML = `
                    <button class="btn-copy" title="Копировать">
                        <svg viewBox="0 0 24 24"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
                    </button>
                `;
            }
            wrapper.appendChild(buttonsDiv);

            const copyBtn = buttonsDiv.querySelector('.btn-copy');
            if (copyBtn) {
                copyBtn.addEventListener('click', () => copyToClipboard(text || "Фото"));
            }

            const editBtn = buttonsDiv.querySelector('.btn-edit');
            if (editBtn) {
                editBtn.addEventListener('click', () => {
                    inputArea.value = text;
                    inputArea.focus();
                    inputArea.style.height = 'auto';
                    inputArea.style.height = (inputArea.scrollHeight) + 'px';
                    
                    currentEditingMessageId = messageId; 
                });
            }
            
            messagesContainer.appendChild(wrapper);
            messagesContainer.scrollTop = messagesContainer.scrollHeight;
        }

        async function loadChatHistory() {
            try {
                const response = await fetch("https://new-1-5155.onrender.com/api/history");
                const history = await response.json();
                messagesContainer.innerHTML = ""; 
                history.forEach(msg => {
                    const textContent = msg.content || msg.text || "";
                    appendMessage(textContent, msg.role === 'user', "", msg.id);
                });
            } catch (e) {
                console.error("Ошибка загрузки истории:", e);
            }
        }

        sendBtn.addEventListener('click', async () => {
            const text = inputArea.value.trim();
            if (!text && !selectedImageBase64) return;
            
            if (currentEditingMessageId !== null) {
                try {
                    await fetch(`https://new-1-5155.onrender.com/api/delete/${currentEditingMessageId}`, {
                        method: 'DELETE'
                    });
                    
                    const oldWrapper = document.querySelector(`[data-id="${currentEditingMessageId}"]`);
                    if (oldWrapper) {
                        oldWrapper.remove();
                    }
                } catch (e) {
                    console.error("Не удалось удалить старое сообщение:", e);
                }
                currentEditingMessageId = null; 
            }
            
            appendMessage(text || "Фото", true, selectedImageBase64); 
            const imgToSend = selectedImageBase64;
            
            inputArea.value = '';
            inputArea.style.height = '40px'; 
            selectedImageBase64 = "";
            fileInput.value = "";
            previewContainer.classList.add('preview-hidden');

            try {
                const response = await fetch("https://new-1-5155.onrender.com/api/chat", {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ text: text, image: imgToSend })
                });
                const data = await response.json();
                appendMessage(data.text, false); 
            } catch (e) {
                appendMessage("Ошибка соединения. Сервер на Render спит.", false);
            }
        });

        document.addEventListener('DOMContentLoaded', loadChatHistory);
    </script>
</body>
</html>
