<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AI Chat</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        html, body { width: 100%; height: 100%; background-color: #1a202c; color: #fff; font-family: sans-serif; overflow: hidden; }
        #auth-screen { display: flex; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background-color: #1a202c; z-index: 10000; align-items: center; justify-content: center; }
        .auth-box { background: #2d3748; padding: 24px; border-radius: 12px; text-align: center; width: 90%; max-width: 360px; }
        .auth-box input { width: 100%; padding: 12px; border-radius: 8px; border: 1px solid #4a5568; background: #1a202c; color: #fff; margin-bottom: 16px; }
        .auth-box button { width: 100%; padding: 12px; background: #3182ce; border: none; color: white; border-radius: 8px; cursor: pointer; font-weight: bold; }
        #chat-screen { display: none; flex-direction: column; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background-color: #1a202c; }
        header { display: flex; justify-content: space-between; align-items: center; padding: 0 16px; height: 60px; background-color: #2d3748; border-bottom: 1px solid #4a5568; }
        .messages { flex: 1; overflow-y: auto; padding: 12px; display: flex; flex-direction: column; gap: 12px; }
        .message { padding: 14px 16px; border-radius: 12px; font-size: 15px; word-break: break-word; }
        .message.bot { background: #2d3748; }
        .message.user { background: #3182ce; align-self: flex-end; }
        .input-area { padding: 12px; background: #2d3748; border-top: 1px solid #4a5568; }
        .input-row { display: flex; gap: 8px; }
        textarea { flex: 1; background: #1a202c; border: 1px solid #4a5568; color: white; padding: 10px; border-radius: 8px; resize: none; height: 40px; }
        button { cursor: pointer; }
    </style>
</head>
