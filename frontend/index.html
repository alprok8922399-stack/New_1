<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Chat</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; background: #000000; color: #fff; height: 100vh; overflow: hidden; }
        
        .auth-container {
            position: fixed;
            top: 0; left: 0; width: 100vw; height: 100vh;
            background: #000000;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            padding: 20px;
        }
        .auth-box {
            width: 100%;
            max-width: 320px;
            text-align: center;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        .auth-box h2 { font-size: 20px; font-weight: 600; margin-bottom: 10px; }
        .auth-box input {
            background: #1c1c1e; border: 1px solid #333; border-radius: 12px;
            color: #fff; padding: 14px; font-size: 16px; text-align: center; outline: none;
        }
        .auth-box button {
            background: #0a84ff; border: none; border-radius: 12px;
            color: #fff; padding: 14px; font-size: 16px; font-weight: bold; cursor: pointer;
        }

        .chat-container { width: 100vw; max-width: 100%; height: 100vh; margin: 0; display: flex; flex-direction: column; background: #000000; display: none; }
        
        header { 
            background: #000000; padding: 12px 15px; display: flex;
            justify-content: space-between; align-items: center;
            border-bottom: 1px solid #222; font-weight: bold; font-size: 18px; color: #fff; 
        }
        .clear-btn {
            background: none; border: 1px solid #333; color: #0a84ff; 
            padding: 6px 12px; border-radius: 10px; font-size: 14px; cursor: pointer;
        }

        .messages { flex: 1; overflow-y: auto; padding: 15px; display: flex; flex-direction: column; gap: 16px; }
        .message-wrapper { display: flex; flex-direction: column; width: 100%; }
        
        .message { max-width: 90%; padding: 12px 16px; border-radius: 18px; font-size: 15px; word-wrap: break-word; }
        .message.bot { background: #1c1c1e; align-self: flex-start; border-bottom-left-radius: 4px; color: #f3f4f6; }
        .message.user { background: #2c2c2e; align-self: flex-end; border-bottom-right-radius: 4px; color: #fff; }
        
        .message p { margin-bottom: 6px; line-height: 1.45; }
        .message p:last-child { margin-bottom: 0; }

        .hourglass { 
            display: inline-block; width: 18px; height: 18px; border: 2px solid #0a84ff; 
            border-radius: 4px; position: relative; animation: rotateHourglass 1.5s linear infinite; margin: 2px 4px;
        }
        .hourglass::before { 
            content: ''; position: absolute; top: 1px; left: 1px; right: 1px; bottom: 1px; 
            background: #0a84ff; clip-path: polygon(0 0, 100% 0, 50% 50%, 100% 100%, 0 100%, 50% 50%); 
        }
        @keyframes rotateHourglass { 100% { transform: rotate(180deg); } }

        .input-area { padding: 10px; background: #000000; border-top: 1px solid #222; display: flex; flex-direction: column; gap: 5px; }
        .input-row { display: flex; align-items: flex-end; gap: 8px; }
        
        textarea { 
            flex: 1; background: #1c1c1e; border: 1px solid #333; border-radius: 20px; 
            color: #fff; padding: 11px 16px; outline: none; resize: none; 
            min-height: 40px; max-height: 120px; line-height: 1.4; font-size: 16px; 
        }
        .input-row button { background: none; border: none; color: #0a84ff; font-size: 22px; cursor: pointer; padding: 5px; }
    </style>
</head>
<body>

    <div class="auth-container" id="auth-screen">
        <div class="auth-box">
            <h2>Введите ваше имя</h2>
            <input type="text" id="username-input" placeholder="Ваше имя..." autofocus>
            <button id="login-btn">Войти</button>
        </div>
    </div>

    <div class="chat-container" id="chat-screen">
        <header>
            <div class="header-title" id="chat-header-title">Друг и помощник</div>
            <button class="clear-btn" id="clear-btn">Очистить</button>
        </header>
        <div class="messages" id="messages"></div>
        
        <div class="input-area">
            <div class="input-row">
                <textarea id="input" placeholder="Сообщение..." rows="1"></textarea>
                <button id="send-btn">➤</button>
            </div>
        </div>
    </div>

    <script>
        const SECRET_CODE = 'alprok8922399';
        const BACKEND_URL = 'https://new-1-5155.onrender.com'; // Наш точный адрес
        
        let chatMode = 'public'; 
        let userDisplayName = ''; 

        const authScreen = document.getElementById('auth-screen');
        const chatScreen = document.getElementById('chat-screen');
        const usernameInput = document.getElementById('username-input');
        const loginBtn = document.getElementById('login-btn');
        const chatHeaderTitle = document.getElementById('chat-header-title');
        const messagesContainer = document.getElementById('messages');
        const inputArea = document.getElementById('input');
        const sendBtn = document.getElementById('send-btn');
        const clearBtn = document.getElementById('clear-btn');

        function handleLogin() {
            const enteredName = usernameInput.value.trim();
            if (!enteredName) return;

            userDisplayName = enteredName;

            if (enteredName === SECRET_CODE) {
                chatMode = 'private';
                chatHeaderTitle.textContent = 'Друг и помощник';
                authScreen.style.display = 'none';
                chatScreen.style.display = 'flex';
                loadChatHistory();
            } else {
                chatMode = 'public';
                chatHeaderTitle.textContent = `Чат для: ${enteredName}`;
                authScreen.style.display = 'none';
                chatScreen.style.display = 'flex';
                if (messagesContainer) messagesContainer.innerHTML = ""; 
            }
        }

        loginBtn.addEventListener('click', handleLogin);
        usernameInput.addEventListener('keypress', (e) => { if (e.key === 'Enter') handleLogin(); });

        if (inputArea) {
            inputArea.addEventListener('input', function() {
                this.style.height = 'auto';
                this.style.height = (this.scrollHeight) + 'px';
            });
        }

        function formatAiText(text) {
            let rawText = text || "";
            rawText = rawText.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");

            const segments = rawText.split(/```/g);
            if (segments.length > 1) {
                for (let i = 1; i < segments.length; i += 2) {
                    let codeLines = segments[i].replace(/^[a-zA-Z0-9_-]+\n/, "");
                    segments[i] = `<pre style="background: #161618; color: #e3e3e3; padding: 14px; border-radius: 12px; font-family: monospace; font-size: 14px; white-space: pre-wrap; margin: 12px 0; border: 1px solid #2c2c2e; text-align: left; overflow-x: auto;"><code>${codeLines.trim()}</code></pre>`;
                }
            }

            let formattedText = "";
            for (let i = 0; i < segments.length; i++) {
                if (i % 2 === 0) {
                    let txt = segments[i].replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>');
                    const paragraphs = txt.split('\n');
                    formattedText += paragraphs.map(p => p.trim() === "" ? '<div style="height: 6px;"></div>' : `<p>${p}</p>`).join('');
                } else {
                    formattedText += segments[i];
                }
            }
            return formattedText;
        }

        function appendMessage(text, isUser, isLoader = false) {
            if (!text && !isLoader) return null;

            const className = isUser ? 'message user' : 'message bot';
            let finalHtml = isLoader ? '<div class="hourglass"></div>' : (isUser ? text.replace(/\n/g, '<br>') : formatAiText(text));
            
            const wrapper = document.createElement('div');
            wrapper.className = 'message-wrapper';
            
            const messageDiv = document.createElement('div');
            messageDiv.className = className;
            messageDiv.innerHTML = finalHtml;
            wrapper.appendChild(messageDiv);
            
            messagesContainer.appendChild(wrapper);
            messagesContainer.scrollTop = messagesContainer.scrollHeight;
            return wrapper;
        }

        async function loadChatHistory() {
            try {
                const response = await fetch(`${BACKEND_URL}/api/history`, { cache: 'no-store' });
                const history = await response.json();
                messagesContainer.innerHTML = ""; 
                history.forEach(msg => {
                    appendMessage(msg.content || msg.text || "", msg.role === 'user');
                });
            } catch (e) {
                console.error(e);
            }
        }

        clearBtn.addEventListener('click', () => { messagesContainer.innerHTML = ""; });

        sendBtn.addEventListener('click', async () => {
            const text = inputArea.value.trim();
            if (!text) return;
            
            appendMessage(text, true); 
            inputArea.value = '';
            inputArea.style.height = '40px'; 

            const loaderWrapper = appendMessage('', false, true);
            const currentDateTime = new Date().toLocaleString("ru-RU", { timeZone: "Europe/Moscow" });

            try {
                const response = await fetch(`${BACKEND_URL}/api/chat`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    cache: 'no-store',
                    body: JSON.stringify({ 
                        text: text, 
                        mode: chatMode,
                        clientTime: currentDateTime,
                        history: []
                    })
                });
                const data = await response.json();
                if (loaderWrapper) loaderWrapper.remove();
                appendMessage(data.text, false); 
            } catch (e) {
                if (loaderWrapper) loaderWrapper.remove();
                appendMessage("Ошибка соединения. Проверь адрес бэкенда.", false);
            }
        });
    </script>
</body>
</html>
